<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구글 앱스 스크립트 실습실 · 상담교사 편</title>
<meta name="description" content="상담교사를 위한 구글 앱스 스크립트 업무 자동화 실습 웹앱 · 비산초등학교 신동영">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='10' cy='10' r='6' fill='%234285F4'/%3E%3Ccircle cx='22' cy='10' r='6' fill='%23EA4335'/%3E%3Ccircle cx='10' cy='22' r='6' fill='%23FBBC04'/%3E%3Ccircle cx='22' cy='22' r='6' fill='%2334A853'/%3E%3C/svg%3E">
<style>
  :root {
    --blue: #1a73e8; --blue-soft: #e8f0fe; --blue-ink: #174ea6;
    --green: #188038; --green-soft: #e6f4ea;
    --yellow: #b06000; --yellow-soft: #fef7e0;
    --red: #c5221f; --red-soft: #fce8e6;
    --ink: #1f2430; --ink-2: #3c4350; --muted: #667085; --line: #e4e7ec;
    --bg: #f5f7fa; --card: #ffffff; --code-bg: #0d1117;
    --radius: 14px; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
    --font: 'Pretendard Variable', Pretendard, -apple-system, 'Malgun Gothic', sans-serif;
    --mono: 'D2Coding', 'JetBrains Mono', Consolas, 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font-family: var(--mono); font-size: .88em; background: #eef1f5; color: #b3261e; padding: .1em .38em; border-radius: 5px; }
  h1, h2, h3, h4 { line-height: 1.3; margin: 0; letter-spacing: -.01em; }
  button { font-family: inherit; }

  /* ── header ── */
  .topbar { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .topbar-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 20px; padding: 0 20px; height: 62px; }
  .brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; color: var(--ink); }
  .brand:hover { text-decoration: none; }
  .dots { display: grid; grid-template-columns: 9px 9px; gap: 3px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; display: block; }
  .dots i:nth-child(1) { background: #4285f4; } .dots i:nth-child(2) { background: #ea4335; }
  .dots i:nth-child(3) { background: #fbbc04; } .dots i:nth-child(4) { background: #34a853; }
  .brand b { font-size: 16px; display: block; line-height: 1.2; }
  .brand small { font-size: 11.5px; color: var(--muted); display: block; line-height: 1.2; }
  nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-left: auto; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs a { white-space: nowrap; padding: 8px 13px; border-radius: 999px; color: var(--ink-2); font-size: 14.5px; font-weight: 600; }
  nav.tabs a:hover { background: #f0f2f5; text-decoration: none; }
  nav.tabs a.active { background: var(--blue-soft); color: var(--blue-ink); }

  main { max-width: 1200px; margin: 0 auto; padding: 28px 20px 60px; }
  .view { display: none; }
  .view.active { display: block; }

  /* ── common blocks ── */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .pad { padding: 24px; }
  .section { margin-top: 36px; scroll-margin-top: 80px; }
  .section-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .section-head h2 { font-size: 21px; }
  .section-head p { margin: 0; color: var(--muted); font-size: 14.5px; }
  .kicker { font-size: 13px; font-weight: 700; color: var(--blue); letter-spacing: .02em; }
  .muted { color: var(--muted); }
  .grid { display: grid; gap: 14px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #f0f2f5; color: var(--ink-2); }
  .b-blue { background: var(--blue-soft); color: var(--blue-ink); }
  .b-green { background: var(--green-soft); color: var(--green); }
  .b-yellow { background: var(--yellow-soft); color: var(--yellow); }
  .b-red { background: var(--red-soft); color: var(--red); }
  .btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 9px 15px; border-radius: 10px; font-size: 14.5px; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s; }
  .btn:hover { background: #f5f7fa; text-decoration: none; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { background: #1765cc; }
  .btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
  .btn .ico { font-size: 15px; }
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: #f8f9fb; font-weight: 700; color: var(--ink-2); font-size: 13.5px; }
  tr:last-child td { border-bottom: none; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
  .callout { border-radius: 12px; padding: 14px 16px; font-size: 15px; display: flex; gap: 10px; }
  .callout.info { background: var(--blue-soft); color: #1d3b6e; }
  .callout.ok { background: var(--green-soft); color: #14532d; }
  .callout.warn { background: var(--yellow-soft); color: #6b3d00; }
  .callout .ci { flex-shrink: 0; }
  ul.clean, ol.clean { margin: 0; padding-left: 20px; }
  ul.clean li, ol.clean li { margin: 4px 0; }

  /* ── home ── */
  .hero { padding: 34px 32px; position: relative; overflow: hidden; }
  .hero::after { content: ''; position: absolute; right: -60px; top: -60px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(66,133,244,.12), transparent 70%); }
  .hero h1 { font-size: 32px; margin: 8px 0 10px; }
  .hero p.lead { margin: 0; color: var(--ink-2); font-size: 16.5px; max-width: 720px; }
  .hero .meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 20px; }
  .hero .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .session { padding: 20px 22px; }
  .session-top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .session h3 { font-size: 17px; margin-bottom: 10px; }
  .session ol { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  .session li { counter-increment: s; position: relative; padding: 9px 10px 9px 38px; border-radius: 10px; }
  .session li::before { content: counter(s); position: absolute; left: 8px; top: 9px; width: 22px; height: 22px; border-radius: 50%; background: #f0f2f5; font-size: 12.5px; font-weight: 700; display: grid; place-items: center; color: var(--ink-2); }
  .session li a { color: var(--ink); display: block; }
  .session li:hover { background: #f5f7fa; }
  .session li:hover a { text-decoration: none; color: var(--blue-ink); }
  .quick a { display: block; padding: 14px 16px; color: var(--ink); }
  .quick a:hover { text-decoration: none; border-color: #c7d7f5; background: #fafcff; }
  .quick b { display: block; font-size: 15px; }
  .quick small { color: var(--muted); font-size: 13px; }
  .concept-card { padding: 20px 22px; }
  .concept-card h3 { font-size: 17px; margin: 8px 0 8px; }
  .concept-card p { margin: 0 0 10px; color: var(--ink-2); font-size: 15px; }
  .steps-inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14.5px; }
  .steps-inline span { background: #fff; border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; }
  .steps-inline em { font-style: normal; color: var(--muted); }
  details.faq { border-bottom: 1px solid var(--line); }
  details.faq:last-child { border-bottom: none; }
  details.faq summary { cursor: pointer; padding: 14px 18px; font-weight: 600; list-style: none; display: flex; gap: 10px; }
  details.faq summary::-webkit-details-marker { display: none; }
  details.faq summary::before { content: '＋'; color: var(--blue); font-weight: 700; }
  details.faq[open] summary::before { content: '－'; }
  details.faq .ans { padding: 0 18px 16px 44px; color: var(--ink-2); font-size: 15px; }

  /* ── lab layout ── */
  .lab-layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 22px; align-items: start; }
  .lab-side { position: sticky; top: 82px; max-height: calc(100vh - 100px); overflow-y: auto; padding: 14px; }
  .lab-side .room { padding: 6px 8px 12px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .lab-side .room b { font-size: 16px; display: block; }
  .lab-side .room small { color: var(--muted); font-size: 13px; }
  .lab-side .room-go { width: 100%; justify-content: center; margin-top: 12px; }
  .side-group { margin: 12px 0 4px; padding: 0 8px; }
  .side-group b { font-size: 12.5px; color: var(--blue); letter-spacing: .03em; }
  .side-group span { font-size: 13px; color: var(--ink-2); font-weight: 600; margin-left: 4px; }
  .side-item { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 10px; color: var(--ink-2); font-size: 14.5px; font-weight: 500; }
  .side-item:hover { background: #f5f7fa; text-decoration: none; }
  .side-item.active { background: var(--blue-soft); color: var(--blue-ink); font-weight: 700; }
  .side-item .chk { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #c9ced6; flex-shrink: 0; display: grid; place-items: center; font-size: 11px; color: #fff; }
  .side-item.done .chk { background: var(--green); border-color: var(--green); }
  .side-item.done .chk::after { content: '✓'; }
  .progress { margin: 4px 8px 10px; height: 6px; background: #eef1f5; border-radius: 999px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--green); border-radius: 999px; transition: width .3s; }
  .side-select { display: none; width: 100%; padding: 11px 12px; font-size: 15px; border: 1px solid var(--line); border-radius: 10px; font-family: inherit; background: #fff; }

  .lab { padding: 28px 30px; }
  .lab-head .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .lab-head h2 { font-size: 26px; }
  .lab-head p { margin: 8px 0 0; color: var(--ink-2); font-size: 16px; }
  .lab-head .row { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
  .done-toggle { flex-shrink: 0; }
  .done-toggle.on { background: var(--green-soft); border-color: #b7dfc3; color: var(--green); }
  .link-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .link-row .btn.k-copy { background: var(--green); border-color: var(--green); color: #fff; }
  .link-row .btn.k-copy:hover { background: #137333; }
  .lab-block { margin-top: 28px; }
  .lab-block h3 { font-size: 17px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .lab-block h3 .num { width: 24px; height: 24px; border-radius: 7px; background: var(--ink); color: #fff; font-size: 13px; display: grid; place-items: center; }
  .concepts li { margin: 6px 0; }
  ol.follow { list-style: none; padding: 0; margin: 0; counter-reset: f; }
  ol.follow li { counter-increment: f; position: relative; padding: 10px 0 10px 40px; border-bottom: 1px dashed var(--line); }
  ol.follow li:last-child { border-bottom: none; }
  ol.follow li::before { content: counter(f); position: absolute; left: 0; top: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--blue-soft); color: var(--blue-ink); font-weight: 700; font-size: 13.5px; display: grid; place-items: center; }
  .prompt-box { background: #fbfaf6; border: 1px solid #ece6d3; border-radius: 12px; overflow: hidden; }
  .box-bar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid #ece6d3; background: #f7f3e6; }
  .box-bar .t { font-size: 13px; font-weight: 700; color: #6b5a1e; margin-right: auto; }
  .prompt-box pre { margin: 0; padding: 16px 18px; white-space: pre-wrap; font-family: var(--font); font-size: 14.5px; line-height: 1.7; color: var(--ink); max-height: 360px; overflow: auto; }
  .code-box { border-radius: 12px; overflow: hidden; background: var(--code-bg); border: 1px solid #1f2733; }
  .code-tabs { display: flex; align-items: center; gap: 2px; padding: 6px 8px; background: #161b22; border-bottom: 1px solid #262c36; }
  .code-tabs button.tab { background: transparent; border: 0; color: #9aa4b2; font-family: var(--mono); font-size: 13px; padding: 7px 12px; border-radius: 7px; cursor: pointer; }
  .code-tabs button.tab.active { background: #2b3340; color: #fff; }
  .code-tabs .spacer { flex: 1; }
  .code-tabs .lines { color: #6e7681; font-size: 12px; margin-right: 6px; }
  .btn.dark { background: #2b3340; border-color: #3a4352; color: #e6edf3; }
  .btn.dark:hover { background: #3a4352; }
  .code-box pre { margin: 0; max-height: 520px; overflow: auto; }
  .code-box pre code { display: block; padding: 16px 18px; background: transparent; color: #e6edf3; font-size: 13.5px; line-height: 1.6; border-radius: 0; white-space: pre; }
  .code-note { margin-bottom: 10px; }
  .pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); }
  .pager a { max-width: 48%; }
  .pager small { display: block; color: var(--muted); font-size: 12px; font-weight: 500; }

  /* ── examples ── */
  .ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .ex-card { display: flex; flex-direction: column; padding: 16px; color: var(--ink); min-height: 96px; }
  .ex-card:hover { text-decoration: none; border-color: #c7d7f5; background: #fafcff; }
  .ex-card b { font-size: 15.5px; }
  .ex-card small { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .ex-card .go { margin-top: auto; padding-top: 10px; font-size: 12.5px; color: var(--blue); font-weight: 700; }

  /* ── share ── */
  .share-layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 22px; align-items: start; }
  .form-field { margin-bottom: 14px; }
  .form-field label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; color: var(--ink-2); }
  .form-field input, .form-field select, .form-field textarea, .search { width: 100%; padding: 11px 12px; font-size: 15px; font-family: inherit; border: 1px solid #d0d5dd; border-radius: 10px; background: #fff; color: var(--ink); }
  .form-field textarea { resize: vertical; min-height: 76px; }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus, .search:focus { outline: 2px solid rgba(26,115,232,.25); border-color: var(--blue); }
  .form-msg { font-size: 14px; font-weight: 600; min-height: 20px; margin-top: 10px; }
  .form-msg.err { color: var(--red); } .form-msg.ok { color: var(--green); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: #fff; padding: 6px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
  .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .share-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .share-tools .search { max-width: 260px; }
  .share-card { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
  .share-card h4 { font-size: 16px; }
  .share-card p { margin: 0; font-size: 14.5px; color: var(--ink-2); }
  .share-card .who { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .share-card .btn { align-self: flex-start; margin-top: 6px; }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }

  footer { border-top: 1px solid var(--line); background: #fff; }
  footer .inner { max-width: 1200px; margin: 0 auto; padding: 22px 20px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
  footer b { color: var(--ink-2); }

  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: #1f2430; color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 14.5px; opacity: 0; transition: .25s; pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 960px) {
    .lab-layout, .share-layout { grid-template-columns: minmax(0, 1fr); }
    .lab-side { position: static; max-height: none; }
    .lab-side .side-list { display: none; }
    .side-select { display: block; }
    .g3 { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 640px) {
    main { padding: 18px 16px 48px; }
    .topbar-inner { padding: 0 12px; gap: 10px; height: auto; min-height: 56px; flex-wrap: wrap; padding-top: 8px; }
    .brand small { display: none; }
    nav.tabs { margin-left: 0; width: 100%; padding-bottom: 8px; }
    .g2, .g3 { grid-template-columns: minmax(0, 1fr); }
    .hero { padding: 24px 20px; }
    .hero h1 { font-size: 25px; }
    .lab { padding: 20px 18px; }
    .lab-head h2 { font-size: 22px; }
    .lab-head .row { flex-direction: column; }
    .pad { padding: 18px; }
    th, td { padding: 10px; }
  }
</style>
</head>

</main>

  <div class="inner">
    <span>자료 제작 · <b>비산초등학교 신동영</b></span>

<script>
/* ============================================================
 * '함께 공유' 게시판 연결 주소
 * README.md의 안내대로 src/code/share_code.gs를 웹앱으로 배포한 뒤
 * 발급된 웹 앱 URL(…/exec)을 아래 따옴표 안에 붙여 넣으세요.
 * ============================================================ */
const SHARE_API_URL = 'https://script.google.com/macros/s/AKfycbwkZmrf5dgmse7oxgY_ioNqymPvPemqpPaAOsg9jm_qLLYYGae2SMvwpLyngGrI53FF/exec';
</script>
<script>
/* 실습 웹앱 콘텐츠 데이터
 * - 텍스트 안의 **굵게**, `코드` 표기는 화면에서 서식으로 바뀝니다.
 * - files[].src 는 src/code/ 폴더의 파일 이름이며, build.js가 내용을 끼워 넣습니다.
 */
window.APP_DATA = {
  course: {

<script>
window.CODE_FILES = {"certificate.gs":"/**\n * 연수 수료자 명단 → 축하 문구 일괄 생성\n *\n * 시트 구조: A열 이름 | B열 생성 문구 (1행은 머리글)\n * 시트를 새로고침하면 상단에 [연수 도구] 메뉴가 생깁니다.\n */\n\n// 시트를 열면 자동 실행 → [연수 도구] 메뉴 만들기\nfunction onOpen() {\n  SpreadsheetApp.getUi()\n    .createMenu(\"연수 도구\")\n    .addItem(\"문구 일괄 생성\", \"greetAll\")\n    .addItem(\"B열 지우기\", \"clearMessages\")\n    .addToUi();\n}\n\n// A열 이름을 읽어 B열에 축하 문구 쓰기\nfunction greetAll() {\n  const sheet = SpreadsheetApp.getActiveSheet();\n  const lastRow = sheet.getLastRow();                    // 데이터가 있는 마지막 행\n  let count = 0;\n\n  for (let row = 2; row \u003c= lastRow; row++) {             // 2행부터 끝까지 반복\n    const name = sheet.getRange(row, 1).getValue();      // A열 읽기\n    if (name === \"\") continue;                           // 빈 칸은 건너뛰기\n    const message = \"🎓 \" + name + \" 님, 연수 수료를 축하합니다!\";\n    sheet.getRange(row, 2).setValue(message)             // B열에 쓰기\n      .setFontColor(\"#2e7d32\");\n    count++;\n  }\n\n  // 오른쪽 아래에 잠깐 나타나는 알림\n  SpreadsheetApp.getActiveSpreadsheet().toast(count + \"명의 축하 문구를 만들었습니다.\", \"연수 도구\", 5);\n}\n\n// B열 문구 지우기 (머리글은 남김)\nfunction clearMessages() {\n  const sheet = SpreadsheetApp.getActiveSheet();\n  const lastRow = sheet.getLastRow();\n  if (lastRow \u003c 2) return;                               // 지울 데이터가 없으면 종료\n  sheet.getRange(2, 2, lastRow - 1, 1).clearContent();\n}\n","calendar.gs":"/**\n * [독립형] 학사 일정 구글 캘린더 일괄 등록\n * 실행 함수: syncDefaultCalendar\n *\n * ※ 프로젝트 설정(⚙)의 시간대가 '(GMT+09:00) 서울'인지 먼저 확인하세요.\n */\n\n// 1. 등록할 일정 목록 (날짜는 '연-월-일' 형식, color는 캘린더 일정 색)\nconst CAL_EVENTS_DB = [\n  { date: \"2026-10-22\", title: \"🏫 2학기 학부모 공개수업\", location: \"각 학급 교실\", color: \"MAUVE\" },\n  { date: \"2026-10-30\", title: \"📝 방과후 캠프 희망서 마감\", location: \"교무실\", color: \"RED\" },\n  { date: \"2026-11-12\", title: \"🔬 과학탐구 발표대회\", location: \"강당\", color: \"CYAN\" }\n];\n\n// 2. 실행 함수: 위 일정을 내 기본 캘린더에 종일 일정으로 등록\nfunction syncDefaultCalendar() {\n  Logger.log(\"📅 캘린더 일정 등록을 시작합니다...\");\n\n  const calendar = CalendarApp.getDefaultCalendar();\n\n  CAL_EVENTS_DB.forEach(event => {\n    const eventDate = toLocalDate_(event.date);\n\n    // 같은 날 같은 제목의 일정이 이미 있으면 건너뛰기 (중복 등록 방지)\n    const exists = calendar.getEventsForDay(eventDate)\n      .some(ev => ev.getTitle() === event.title);\n    if (exists) {\n      Logger.log(\"⏭ 이미 있음: \" + event.title);\n      return;\n    }\n\n    const created = calendar.createAllDayEvent(event.title, eventDate, {\n      location: event.location,\n      description: \"Apps Script로 자동 등록된 일정입니다.\"\n    });\n    created.setColor(CalendarApp.EventColor[event.color]);   // 일정 종류별 색 구분\n    Logger.log(\"✅ 등록: \" + event.title + \" (\" + event.date + \")\");\n\n    Utilities.sleep(150); // 연속 등록 시 잠깐 쉬기\n  });\n\n  Logger.log(\"🎉 완료! 캘린더를 확인해 보세요.\");\n}\n\n// '2026-10-22' 문자열을 스크립트 시간대 기준 날짜로 변환\n// (new Date(\"2026-10-22\")는 UTC 기준이라 시간대에 따라 하루가 밀릴 수 있음)\nfunction toLocalDate_(text) {\n  const [y, m, d] = text.split(\"-\").map(Number);\n  return new Date(y, m - 1, d);\n}\n","teacherSheets.gs":"/**\n * [독립형] 교무 업무 시트 3종 자동 생성\n * 드라이브에 '교무부 업무 시트'를 새로 만들고\n * 연수 이수 관리 · 연간 업무 계획 · 학교 평가 시트를 서식과 함께 채웁니다.\n * 실행 함수: createAllSheets\n */\n\nfunction createAllSheets() {\n  const ss = SpreadsheetApp.create('교무부 업무 시트');\n\n  // ── 1. 연수 이수 관리 ──────────────────────────\n  const s1 = ss.insertSheet('연수 이수 관리');\n  const h1 = ['번호', '교사명', '연수명', '연수 기관', '연수 종류', '이수 시간', '이수일', '비고'];\n  styleHeader_(s1, h1, '#37474f');\n\n  // 연수 종류는 목록에서만 고르도록 제한\n  setDropdown_(s1, 'E2:E200', ['직무연수', '자율연수', '원격연수', '집합연수']);\n\n  s1.getRange(2, 1, 2, 8).setValues([\n    [1, '홍길동', 'AI 활용 교육 직무연수', '경상북도교육청연수원', '직무연수', 30, '2026-10-15', ''],\n    [2, '김철수', '구글 앱스 스크립트 활용 연수', '○○교육연수원', '원격연수', 4, '2026-10-22', ''],\n  ]);\n\n  // 오른쪽에 총 이수 시간 자동 합계\n  s1.getRange('J1').setValue('총 이수 시간').setFontWeight('bold');\n  s1.getRange('K1').setFormula('=SUM(F2:F200)').setFontWeight('bold');\n\n  setWidths_(s1, [50, 80, 220, 160, 100, 80, 100, 150]);\n\n  // ── 2. 연간 업무 계획 ──────────────────────────\n  const s2 = ss.insertSheet('연간 업무 계획');\n  const h2 = ['번호', '월', '업무명', '세부 내용', '담당자', '협조자', '기간', '상태', '비고'];\n  styleHeader_(s2, h2, '#00796b');\n\n  setDropdown_(s2, 'B2:B200', ['3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월', '1월', '2월']);\n  setDropdown_(s2, 'H2:H200', ['예정', '진행중', '완료', '보류', '취소']);\n\n  s2.getRange(2, 1, 3, 9).setValues([\n    [1, '10월', '학부모 공개수업', '수업 공개 및 협의회', '교무부장', '전 교사', '10월 22일', '진행중', ''],\n    [2, '10월', '2학기 방과후 수요조사', '캠프 희망서 접수', '방과후 담당', '', '10월 15~30일', '진행중', ''],\n    [3, '11월', '과학탐구 발표대회', '학년별 탐구 발표', '과학부', '연구부', '11월 중', '예정', ''],\n  ]);\n\n  // 상태(H열)에 따라 행 전체 색칠\n  colorRowsByStatus_(s2, 'A2:I200', 'H', { '완료': '#d9ead3', '진행중': '#cfe2f3', '보류': '#fff3cd' });\n  setWidths_(s2, [50, 60, 180, 220, 90, 80, 120, 80, 150]);\n\n  // ── 3. 학교 평가 ───────────────────────────────\n  const s3 = ss.insertSheet('학교 평가');\n  const h3 = ['번호', '평가 영역', '평가 지표', '평가 기준', '담당 부서', '담당자', '증빙 자료', '달성 여부', '비고'];\n  styleHeader_(s3, h3, '#6a1b9a');\n\n  setDropdown_(s3, 'B2:B200', ['교육과정', '학생지도', '교원역량', '학교문화', '교육환경', '행정']);\n  setDropdown_(s3, 'H2:H200', ['달성', '미달성', '진행중', '해당없음']);\n\n  s3.getRange(2, 1, 3, 9).setValues([\n    [1, '교육과정', '교육과정 편성·운영', '교육과정 계획서 작성 및 실행', '교무부', '교무부장', '교육과정 편성표', '달성', ''],\n    [2, '교원역량', '교원 연수 이수율', '전 교원 연간 60시간 이상 이수', '연구부', '연구부장', '연수 이수 관리 시트', '진행중', ''],\n    [3, '학교문화', '학교폭력 예방 교육', '학기당 1회 이상 실시', '생활지도부', '담임', '교육 실시 일지', '달성', ''],\n  ]);\n\n  colorRowsByStatus_(s3, 'A2:I200', 'H', { '달성': '#d9ead3', '미달성': '#fce8e6', '진행중': '#cfe2f3' });\n  setWidths_(s3, [50, 90, 180, 220, 90, 80, 150, 80, 150]);\n\n  // 처음 만들어진 빈 시트 삭제 (새 시트를 만든 뒤에 지워야 오류가 나지 않음)\n  const defaultSheet = ss.getSheetByName('시트1') || ss.getSheetByName('Sheet1');\n  if (defaultSheet) ss.deleteSheet(defaultSheet);\n\n  // 독립형은 시트 화면이 없으므로 alert 대신 로그로 안내\n  Logger.log('✅ 완료! 시트 주소: ' + ss.getUrl());\n}\n\n// 1행 머리글 작성 + 색칠 + 고정, 시트 탭 색, 줄무늬 배경\nfunction styleHeader_(sheet, headers, color) {\n  sheet.getRange(1, 1, 1, headers.length).setValues([headers])\n    .setBackground(color).setFontColor('#ffffff')\n    .setFontWeight('bold').setHorizontalAlignment('center');\n  sheet.setRowHeight(1, 34);\n  sheet.setFrozenRows(1);\n  sheet.setTabColor(color);\n  sheet.getRange(2, 1, 199, headers.length)\n    .applyRowBanding(SpreadsheetApp.BandingTheme.LIGHT_GREY, false, false);\n}\n\n// 드롭다운(데이터 확인) 설정\nfunction setDropdown_(sheet, a1, list) {\n  sheet.getRange(a1).setDataValidation(\n    SpreadsheetApp.newDataValidation().requireValueInList(list).build()\n  );\n}\n\n// 열 너비 한 번에 지정\nfunction setWidths_(sheet, widths) {\n  widths.forEach((w, i) => sheet.setColumnWidth(i + 1, w));\n}\n\n// 상태 열 값에 따라 행 전체 배경색을 바꾸는 조건부 서식\nfunction colorRowsByStatus_(sheet, a1, statusCol, colorMap) {\n  const range = sheet.getRange(a1);\n  const rules = Object.keys(colorMap).map(status =>\n    SpreadsheetApp.newConditionalFormatRule()\n      .whenFormulaSatisfied('=$' + statusCol + '2=\"' + status + '\"')\n      .setBackground(colorMap[status])\n      .setRanges([range])\n      .build()\n  );\n  sheet.setConditionalFormatRules(rules);\n}\n","game_index.html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003ctitle>\u003c?= title ?>\u003c/title>\n\u003cstyle>\n  :root{--bg:#0b0a14;--card:#16152a;--card2:#22213d;--accent:#ffb347;--accent2:#ff5e5b;--good:#3ddc97;--bad:#ff3e6c;--text:#fffffe;--muted:#9a9cb8}\n  *{box-sizing:border-box;margin:0;padding:0}\n  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:radial-gradient(ellipse at top,#1a1830,#0b0a14 70%);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}\n  .screen{display:none;width:100%;max-width:680px;animation:fadeIn .4s}\n  .screen.active{display:block}\n  @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}\n  .card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.07)}\n  h1{font-size:2.1rem;text-align:center;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;color:transparent;margin-bottom:4px;letter-spacing:-.02em}\n  .sub{text-align:center;color:var(--muted);margin-bottom:18px;font-size:.95rem}\n  input[type=text]{width:100%;padding:14px 16px;border-radius:12px;border:2px solid var(--card2);background:var(--card2);color:var(--text);font-size:1.1rem;outline:none;margin-bottom:12px}\n  input[type=text]:focus{border-color:var(--accent)}\n  .btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:1.15rem;font-weight:800;cursor:pointer;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#14121f;transition:transform .1s,filter .2s;box-shadow:0 8px 24px rgba(255,120,80,.3)}\n  .btn:hover{filter:brightness(1.1)} .btn:active{transform:scale(.97)} .btn:disabled{opacity:.6;cursor:wait}\n  .rules{background:var(--card2);border-radius:12px;padding:14px 16px;font-size:.9rem;color:var(--muted);line-height:1.8;margin-bottom:16px}\n  .rules b{color:var(--accent)}\n  .msg{text-align:center;color:var(--muted);padding-top:10px;min-height:18px;font-size:.9rem}\n  .msg.err{color:var(--bad)}\n  canvas{display:block;width:100%;border-radius:14px;background:#0d0c18}\n  .hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}\n  .hearts span{font-size:1.35rem;transition:transform .3s;display:inline-block}\n  .hearts span.lost{filter:grayscale(1);opacity:.25;transform:scale(.7)}\n  .score{font-size:1.4rem;color:var(--accent);text-shadow:0 0 12px rgba(255,180,70,.4)}\n  .combo{font-size:.85rem;color:var(--muted)} .combo.hot{color:var(--accent2);animation:pulse .5s}\n  @keyframes pulse{50%{transform:scale(1.3)}}\n  .timerbar{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin:12px 0}\n  .timerbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--good),#7ef0c0);transition:width 1s linear,background .3s}\n  .timerbar i.warn{background:linear-gradient(90deg,var(--bad),var(--accent2))}\n  .question{font-size:1.2rem;font-weight:700;text-align:center;line-height:1.5;min-height:56px;display:flex;align-items:center;justify-content:center;padding:6px;margin-bottom:10px}\n  .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n  .choice{padding:14px;border-radius:12px;background:var(--card2);border:2px solid transparent;font-size:1rem;font-weight:600;color:var(--text);cursor:pointer;text-align:left;display:flex;gap:10px;align-items:center;transition:.15s}\n  .choice em{font-style:normal;width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--muted);flex-shrink:0}\n  .choice:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)} .choice:disabled{cursor:default}\n  .choice.correct{background:var(--good);border-color:var(--good);color:#0f0e17}\n  .choice.wrong{background:var(--bad);border-color:var(--bad)}\n  .choice.dim{opacity:.35}\n  .feedback{text-align:center;min-height:24px;margin-top:10px;font-weight:800;font-size:1.05rem}\n  .feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}\n  .result-title{text-align:center;font-size:1.6rem;font-weight:900;margin:12px 0 4px}\n  .big-score{text-align:center;font-size:3rem;font-weight:900;color:var(--accent);margin:4px 0}\n  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}\n  .stat{background:var(--card2);border-radius:12px;padding:12px;text-align:center}\n  .stat b{display:block;font-size:1.3rem} .stat span{font-size:.8rem;color:var(--muted)}\n  .rank h3{font-size:1rem;color:var(--muted);margin-bottom:8px}\n  .rank ol{list-style:none}\n  .rank li{display:flex;justify-content:space-between;padding:9px 12px;border-radius:8px;background:var(--card2);margin-bottom:6px;font-size:.95rem}\n  .rank li.me{border:1px solid var(--accent)}\n  .rank li:nth-child(1) span:first-child::before{content:'🥇 '}\n  .rank li:nth-child(2) span:first-child::before{content:'🥈 '}\n  .rank li:nth-child(3) span:first-child::before{content:'🥉 '}\n  @media (max-width:480px){.choices{grid-template-columns:1fr}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"screen active\" id=\"start\">\n  \u003cdiv class=\"card\">\n    \u003ccanvas id=\"cvStart\" width=\"640\" height=\"200\">\u003c/canvas>\n    \u003ch1 style=\"margin-top:14px\">⚔️ \u003c?= title ?>\u003c/h1>\n    \u003cp class=\"sub\">정답을 맞혀 몬스터를 베고 던전 최심부의 보스를 쓰러뜨려라!\u003c/p>\n    \u003cdiv class=\"rules\">\n      ❤️ HP \u003cb>3\u003c/b> — 오답·시간 초과 시 몬스터에게 공격당함\u003cbr>\n      ⏱️ 문제당 \u003cb>15초\u003c/b> — 빨리 맞힐수록 강한 일격\u003cbr>\n      🔥 연속 정답 \u003cb>콤보\u003c/b> — 데미지(점수) 배율 상승\u003cbr>\n      🐉 마지막 방의 \u003cb>드래곤\u003c/b>을 쓰러뜨리면 클리어 보너스!\n    \u003c/div>\n    \u003cinput type=\"text\" id=\"name\" placeholder=\"모험가 이름\" maxlength=\"20\">\n    \u003cbutton class=\"btn\" id=\"startBtn\">던전 입장\u003c/button>\n    \u003cdiv class=\"msg\" id=\"msg\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"screen\" id=\"game\">\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"hud\">\n      \u003cdiv class=\"hearts\" id=\"hearts\">\u003c/div>\n      \u003cdiv style=\"text-align:right\">\u003cdiv class=\"score\" id=\"score\">0\u003c/div>\u003cdiv class=\"combo\" id=\"combo\">콤보 0\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003ccanvas id=\"cv\" width=\"640\" height=\"280\">\u003c/canvas>\n    \u003cdiv class=\"timerbar\">\u003ci id=\"tbar\">\u003c/i>\u003c/div>\n    \u003cdiv class=\"question\" id=\"qText\">\u003c/div>\n    \u003cdiv class=\"choices\" id=\"choices\">\u003c/div>\n    \u003cdiv class=\"feedback\" id=\"feedback\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"screen\" id=\"result\">\n  \u003cdiv class=\"card\">\n    \u003ccanvas id=\"cvEnd\" width=\"640\" height=\"220\">\u003c/canvas>\n    \u003cdiv class=\"result-title\" id=\"resultTitle\">\u003c/div>\n    \u003cp class=\"sub\" id=\"resultSub\">\u003c/p>\n    \u003cdiv class=\"big-score\" id=\"finalScore\">0\u003c/div>\n    \u003cdiv class=\"stats\">\n      \u003cdiv class=\"stat\">\u003cb id=\"sCorrect\">\u003c/b>\u003cspan>처치한 몬스터\u003c/span>\u003c/div>\n      \u003cdiv class=\"stat\">\u003cb id=\"sCombo\">\u003c/b>\u003cspan>최대 콤보\u003c/span>\u003c/div>\n      \u003cdiv class=\"stat\">\u003cb id=\"sHp\">\u003c/b>\u003cspan>남은 HP\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"rank\">\u003ch3>🏆 명예의 전당 TOP 10\u003c/h3>\u003col id=\"rankList\">\u003cli>저장 중...\u003c/li>\u003c/ol>\u003c/div>\n    \u003cbutton class=\"btn\" id=\"retryBtn\">다시 도전\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n(function(){\n/* ================= 설정 ================= */\nconst TIME_LIMIT = 15, MAX_HP = 3;\nconst MONSTERS = [\n  {type:'slime',   name:'슬라임'},\n  {type:'bat',     name:'동굴 박쥐'},\n  {type:'skeleton',name:'해골 병사'},\n  {type:'ghost',   name:'떠도는 유령'},\n  {type:'spider',  name:'거대 거미'},\n];\nconst BOSS = {type:'dragon', name:'던전의 지배자 드래곤'};\n\n/* ================= 상태 ================= */\nlet questions=[], idx=0, hp=MAX_HP, score=0, combo=0, maxCombo=0, correctCount=0;\nlet timer=null, timeLeft=TIME_LIMIT, playerName='', locked=false;\nconst $=id=>document.getElementById(id);\nconst W=640, H=280, FLOOR=225;\nconst hero={x:130, state:'idle', atk:0, flash:0, alpha:1};\nconst mon ={x:500, type:'slime', name:'', hpShown:1, alpha:1, scale:1, flash:0, rot:0, state:'idle', fire:0};\nconst bg  ={scroll:0};\nconst shake={mag:0};\nlet particles=[], floats=[], tweens=[], mode='game', endResult=null;\n\n/* ================= 유틸 ================= */\nfunction show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); }\nfunction shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }\nfunction setMsg(t,err){ $('msg').textContent=t; $('msg').className='msg'+(err?' err':''); }\nconst wait=ms=>new Promise(r=>setTimeout(r,ms));\nconst easeOut=p=>1-Math.pow(1-p,3), easeIn=p=>p*p*p, easeInOut=p=>p\u003c.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2, linear=p=>p;\nfunction tween(obj,props,ms,ease){ return new Promise(res=>{ const from={}; for(const k in props) from[k]=obj[k]; tweens.push({obj,props,from,ms,ease:ease||easeOut,start:performance.now(),res}); }); }\nfunction rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }\nfunction circle(g,x,y,r){ g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); }\nfunction spawn(x,y,n,colors,speed,grav){ for(let i=0;i\u003cn;i++){ const a=Math.random()*Math.PI*2, v=speed*(0.4+Math.random()); particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-speed*0.4,life:1,decay:0.02+Math.random()*0.03,size:2+Math.random()*4,color:colors[Math.floor(Math.random()*colors.length)],grav:grav||0.25}); } }\nfunction floatText(x,y,text,color){ floats.push({x,y,text,color,life:1}); }\n\n/* ================= 효과음 ================= */\nlet actx;\nfunction beep(f,d,type,vol,slide){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(),g=actx.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,actx.currentTime); if(slide) o.frequency.exponentialRampToValueAtTime(slide,actx.currentTime+d); g.gain.value=vol||.12; o.connect(g); g.connect(actx.destination); o.start(); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d); o.stop(actx.currentTime+d);}catch(e){} }\nconst sfx={\n  slash:()=>{beep(1400,.08,'sawtooth',.08,300);setTimeout(()=>beep(220,.25,'square',.12,80),60);},\n  hurt:()=>beep(160,.4,'sawtooth',.2,60),\n  step:()=>beep(200,.05,'triangle',.05),\n  tick:()=>beep(1200,.05,'square',.04),\n  die:()=>beep(400,.5,'sawtooth',.1,40),\n  win:()=>[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,.3,'triangle',.15),i*130)),\n  lose:()=>[400,350,300,200].forEach((f,i)=>setTimeout(()=>beep(f,.4,'sawtooth',.12),i*250)),\n};\n\n/* ================= 그리기: 배경 ================= */\nfunction drawBackground(g,t,scroll){\n  // 벽\n  const grad=g.createLinearGradient(0,0,0,H); grad.addColorStop(0,'#1b1a33'); grad.addColorStop(.7,'#141326'); grad.addColorStop(1,'#0c0b16'); g.fillStyle=grad; g.fillRect(0,0,W,H);\n  // 벽돌 (원경)\n  g.strokeStyle='rgba(255,255,255,.05)'; g.lineWidth=1.5;\n  const bs=44, off=(scroll*0.4)%bs;\n  for(let y=0;y\u003cFLOOR;y+=22){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); const rowOff=(y/22)%2?bs/2:0; for(let x=-bs;x\u003cW+bs;x+=bs){ g.beginPath(); g.moveTo(x-off+rowOff,y); g.lineTo(x-off+rowOff,y+22); g.stroke(); } }\n  // 기둥 + 횃불 (중경)\n  const ps=260, poff=(scroll*0.7)%ps;\n  for(let x=-ps;x\u003cW+ps;x+=ps){ const px=x-poff+60;\n    g.fillStyle='#0f0e1c'; g.fillRect(px-14,20,28,FLOOR-20); g.fillStyle='#232244'; g.fillRect(px-11,20,8,FLOOR-20); g.fillStyle='#1a1934'; g.fillRect(px-3,20,14,FLOOR-20);\n    g.fillStyle='#2a2950'; g.fillRect(px-20,14,40,10); g.fillRect(px-20,FLOOR-8,40,8);\n    // 횃불\n    const fl=0.8+Math.sin(t*9+px)*0.15+Math.sin(t*23+px*3)*0.08;\n    const lg=g.createRadialGradient(px+22,90,0,px+22,90,140*fl); lg.addColorStop(0,'rgba(255,160,60,.28)'); lg.addColorStop(1,'rgba(255,120,30,0)'); g.fillStyle=lg; g.fillRect(px-140,-60,330,330);\n    g.fillStyle='#4a3524'; g.fillRect(px+19,92,6,26);\n    g.fillStyle='#ff9a2b'; g.beginPath(); g.moveTo(px+22,72-fl*10); g.quadraticCurveTo(px+34,90,px+22,98); g.quadraticCurveTo(px+10,90,px+22,72-fl*10); g.fill();\n    g.fillStyle='#ffe07a'; g.beginPath(); g.moveTo(px+22,82-fl*6); g.quadraticCurveTo(px+28,92,px+22,96); g.quadraticCurveTo(px+16,92,px+22,82-fl*6); g.fill();\n  }\n  // 바닥\n  const fg=g.createLinearGradient(0,FLOOR,0,H); fg.addColorStop(0,'#2b2a4c'); fg.addColorStop(1,'#141328'); g.fillStyle=fg; g.fillRect(0,FLOOR,W,H-FLOOR);\n  g.fillStyle='#3b3a66'; g.fillRect(0,FLOOR,W,3);\n  g.strokeStyle='rgba(255,255,255,.06)'; const ts=64, toff=scroll%ts;\n  for(let x=-ts;x\u003cW+ts;x+=ts){ g.beginPath(); g.moveTo(x-toff,FLOOR); g.lineTo(x-toff-30,H); g.stroke(); }\n  // 안개\n  const fog=g.createLinearGradient(0,FLOOR-30,0,H); fog.addColorStop(0,'rgba(120,110,200,0)'); fog.addColorStop(1,'rgba(120,110,200,.18)'); g.fillStyle=fog; g.fillRect(0,FLOOR-30,W,H);\n}\nfunction shadow(g,x,y,w){ g.fillStyle='rgba(0,0,0,.45)'; g.beginPath(); g.ellipse(x,y+4,w,7,0,0,Math.PI*2); g.fill(); }\n\n/* ================= 그리기: 기사 ================= */\nfunction drawHero(g,x,y,t,h){\n  g.save(); g.translate(x,y); g.globalAlpha=h.alpha;\n  const run=h.state==='run', bob= run? Math.abs(Math.sin(t*16))*5 : Math.sin(t*3)*2;\n  g.translate(0,-bob);\n  if(h.flash>0){ g.filter='brightness('+(1+h.flash*3)+') saturate('+(1+h.flash*2)+')'; }\n  // 망토\n  const wv=Math.sin(t*5)*4+(run?8:0);\n  g.fillStyle='#b8202f'; g.beginPath(); g.moveTo(-4,-56); g.lineTo(-26-wv,-34); g.lineTo(-22-wv*1.4,-4); g.lineTo(-6,-14); g.closePath(); g.fill();\n  g.fillStyle='#8d1523'; g.beginPath(); g.moveTo(-4,-56); g.lineTo(-18-wv*.6,-30); g.lineTo(-12,-14); g.closePath(); g.fill();\n  // 다리\n  const ls= run? Math.sin(t*16)*9:0;\n  g.fillStyle='#3a3d5e'; rr(g,-12+ls,-20,10,20,3); g.fill(); rr(g,3-ls,-20,10,20,3); g.fill();\n  g.fillStyle='#5a4230'; rr(g,-13+ls,-8,12,9,3); g.fill(); rr(g,2-ls,-8,12,9,3); g.fill();\n  // 몸통 갑옷\n  const ag=g.createLinearGradient(-16,-56,16,-20); ag.addColorStop(0,'#7c95e6'); ag.addColorStop(.5,'#4f66c4'); ag.addColorStop(1,'#2f3f8c');\n  g.fillStyle=ag; rr(g,-16,-56,32,38,8); g.fill();\n  g.fillStyle='rgba(255,255,255,.25)'; rr(g,-12,-52,10,14,4); g.fill();\n  g.fillStyle='#c9a24a'; rr(g,-16,-30,32,6,2); g.fill(); g.fillStyle='#6a5320'; g.fillRect(-3,-31,6,8);\n  // 어깨\n  g.fillStyle='#8fa4e0'; circle(g,-14,-52,7); circle(g,14,-52,7);\n  // 왼팔 + 방패\n  g.fillStyle='#4f66c4'; rr(g,-24,-50,10,22,4); g.fill();\n  const sg=g.createLinearGradient(-38,-50,-14,-20); sg.addColorStop(0,'#e8c66a'); sg.addColorStop(1,'#9a7a2c'); g.fillStyle=sg;\n  g.beginPath(); g.moveTo(-36,-50); g.lineTo(-16,-50); g.lineTo(-16,-30); g.quadraticCurveTo(-26,-16,-36,-30); g.closePath(); g.fill();\n  g.fillStyle='#b8202f'; g.beginPath(); g.moveTo(-31,-46); g.lineTo(-21,-46); g.lineTo(-21,-33); g.quadraticCurveTo(-26,-26,-31,-33); g.closePath(); g.fill();\n  // 머리\n  g.fillStyle='#f5d3ad'; circle(g,0,-68,13);\n  g.fillStyle='#1d1a2a'; g.fillRect(-9,-70,18,3);\n  g.fillStyle='#2a2438'; circle(g,-4,-66,1.6); circle(g,4,-66,1.6);\n  // 투구\n  const hg=g.createLinearGradient(-14,-84,14,-64); hg.addColorStop(0,'#c5d2f5'); hg.addColorStop(1,'#6f86cf'); g.fillStyle=hg;\n  g.beginPath(); g.arc(0,-70,14,Math.PI,0); g.lineTo(14,-64); g.lineTo(-14,-64); g.closePath(); g.fill();\n  g.fillStyle='#4f66c4'; g.fillRect(-15,-66,30,4);\n  g.fillStyle='#e0303f'; g.beginPath(); g.moveTo(0,-84); g.quadraticCurveTo(-14-wv*.5,-96,-22-wv,-80); g.quadraticCurveTo(-10,-84,-2,-78); g.closePath(); g.fill();\n  // 오른팔 + 검 (어깨 기준 회전)\n  g.save(); g.translate(14,-50);\n  let ang=-0.9+Math.sin(t*3)*0.05;\n  if(h.state==='attack'){ const p=h.atk; ang = p\u003c0.35 ? -0.9-p/0.35*1.0 : -1.9+easeOut((p-0.35)/0.65)*3.3; }\n  g.rotate(ang);\n  g.fillStyle='#4f66c4'; rr(g,-5,0,10,22,4); g.fill();\n  g.fillStyle='#f5d3ad'; circle(g,0,24,5);\n  g.translate(0,24); g.rotate(-Math.PI/2);\n  g.fillStyle='#6a4a2a'; rr(g,-2.5,-12,5,14,2); g.fill();\n  g.fillStyle='#d9b24c'; rr(g,-9,0,18,5,2); g.fill();\n  const bg2=g.createLinearGradient(-4,0,4,0); bg2.addColorStop(0,'#ffffff'); bg2.addColorStop(.5,'#c9d3e8'); bg2.addColorStop(1,'#7f8caa'); g.fillStyle=bg2;\n  g.beginPath(); g.moveTo(-4,5); g.lineTo(4,5); g.lineTo(3,52); g.lineTo(0,60); g.lineTo(-3,52); g.closePath(); g.fill();\n  if(h.state==='attack'&&h.atk>0.35&&h.atk\u003c0.8){ g.fillStyle='rgba(255,255,255,.7)'; g.beginPath(); g.moveTo(-4,5); g.lineTo(3,52); g.lineTo(-30,40); g.closePath(); g.fill(); }\n  g.restore();\n  g.restore();\n}\n\n/* ================= 그리기: 몬스터 ================= */\nfunction drawMonster(g,x,y,t,m){\n  if(m.alpha\u003c=0) return;\n  g.save(); g.translate(x,y); g.globalAlpha=m.alpha; g.scale(m.scale,m.scale); g.rotate(m.rot);\n  if(m.flash>0) g.filter='brightness('+(1+m.flash*4)+')';\n  const fn={slime,bat,skeleton,ghost,spider,dragon}[m.type]; fn(g,t,m); g.restore();\n}\nfunction slime(g,t){\n  const sq=1+Math.sin(t*5)*0.08; g.scale(1/sq,sq);\n  const gr=g.createRadialGradient(-10,-40,5,0,-25,40); gr.addColorStop(0,'#9dff9d'); gr.addColorStop(.6,'#3fc46b'); gr.addColorStop(1,'#1f7a45'); g.fillStyle=gr;\n  g.beginPath(); g.moveTo(-34,0); g.quadraticCurveTo(-38,-52,0,-52); g.quadraticCurveTo(38,-52,34,0); g.closePath(); g.fill();\n  g.fillStyle='rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(-12,-38,8,5,-.5,0,Math.PI*2); g.fill();\n  g.fillStyle='#fff'; g.beginPath(); g.ellipse(-12,-24,7,8,0,0,Math.PI*2); g.fill(); g.beginPath(); g.ellipse(6,-24,7,8,0,0,Math.PI*2); g.fill();\n  g.fillStyle='#1a1a1a'; circle(g,-14,-23,3.5); circle(g,4,-23,3.5);\n  g.fillStyle='#145a30'; g.beginPath(); g.arc(-4,-12,6,0,Math.PI); g.fill();\n}\nfunction bat(g,t){\n  g.translate(0,-50+Math.sin(t*6)*6);\n  const fl=Math.sin(t*22)*0.7;\n  g.fillStyle='#3d2a5c';\n  [1,-1].forEach(d=>{ g.save(); g.scale(d,1); g.rotate(-fl*0.5); g.beginPath(); g.moveTo(0,0); g.lineTo(28,-22+fl*10); g.lineTo(44,-6+fl*12); g.lineTo(34,6+fl*8); g.lineTo(40,18+fl*6); g.lineTo(22,10); g.lineTo(8,16); g.closePath(); g.fill(); g.restore(); });\n  const gr=g.createRadialGradient(0,-4,2,0,0,18); gr.addColorStop(0,'#6a4b8f'); gr.addColorStop(1,'#2a1c40'); g.fillStyle=gr; g.beginPath(); g.ellipse(0,2,13,17,0,0,Math.PI*2); g.fill();\n  g.fillStyle='#2a1c40'; g.beginPath(); g.moveTo(-10,-12); g.lineTo(-6,-24); g.lineTo(-1,-12); g.fill(); g.beginPath(); g.moveTo(10,-12); g.lineTo(6,-24); g.lineTo(1,-12 .save();\n  if(shake.mag>0) g.translate((Math.random()-.5)*shake.mag,(Math.random()-.5)*shake.mag);\n  g.translate(0,ch-H);\n  drawBackground(g,t,bg.scroll);\n  if(mode==='game'){\n    shadow(g,hero.x,FLOOR,22); shadow(g,mon.x,FLOOR,mon.type==='dragon'?50:30);\n    if(hero.state==='attack'){ drawMonster(g,mon.x,FLOOR,t,mon); drawHero(g,hero.x,FLOOR,t,hero); } else { drawHero(g,hero.x,FLOOR,t,hero); drawMonster(g,mon.x,FLOOR,t,mon); }\n    drawMonsterBar(g,mon.x,mon); drawRoomLabel(g);\n  } else if(mode==='end'){\n    shadow(g,hero.x,FLOOR,22);\n    if(endResult){ drawHero(g,hero.x,FLOOR,t,hero); if(endResult.cleared){ drawChest(g,430,FLOOR,t); } else { drawMonster(g,mon.x,FLOOR,t,mon); } }\n  } else {\n    shadow(g,hero.x,FLOOR,22); drawHero(g,hero.x,FLOOR,t,hero); shadow(g,mon.x,FLOOR,30); drawMonster(g,mon.x,FLOOR,t,mon);\n  }\n  particles.forEach(p=>{ g.globalAlpha=p.life; g.fillStyle=p.color; g.fillRect(p.x,p.y,p.size,p.size); }); g.globalAlpha=1;\n  floats.forEach(f=>{ g.globalAlpha=f.life; g.font='900 26px sans-serif'; g.textAlign='center'; g.fillStyle='rgba(0,0,0,.6)'; g.fillText(f.text,f.x+2,f.y+2); g.fillStyle=f.color; g.fillText(f.text,f.x,f.y); }); g.globalAlpha=1;\n  g.restore();\n  requestAnimationFrame(loop);\n}\nfunction drawChest(g,x,y,t){\n  g.save(); g.translate(x,y); const gl=0.5+Math.sin(t*4)*0.5;\n  const lg=g.createRadialGradient(0,-30,5,0,-30,90); lg.addColorStop(0,'rgba(255,220,100,'+(0.35*gl+0.2)+')'); lg.addColorStop(1,'rgba(255,220,100,0)'); g.fillStyle=lg; g.fillRect(-100,-130,200,140);\n  g.fillStyle='#7a4a1e'; rr(g,-36,-34,72,34,6); g.fill(); g.fillStyle='#9a5f2a'; rr(g,-36,-56,72,26,8); g.fill();\n  g.fillStyle='#e0b040'; g.fillRect(-36,-34,72,5); g.fillRect(-30,-56,6,56); g.fillRect(24,-56,6,56); rr(g,-7,-40,14,14,3); g.fill();\n  g.fillStyle='#fff3a0'; for(let i=0;i\u003c5;i++){ const a=t*2+i*1.3; circle(g,Math.cos(a)*30,-60+Math.sin(a*1.7)*20,2+gl*2); }\n  g.restore();\n}\nrequestAnimationFrame(loop);\n\n/* ================= 시작 ================= */\nmode='start'; hero.x=200; mon.x=460; mon.type='slime'; mon.name='';\nfunction startGame(){\n  playerName=$('name').value.trim();\n  if(!playerName){ $('name').focus(); setMsg('이름을 입력해 주세요',true); return; }\n  if(typeof google==='undefined'||!google.script){ setMsg('웹 앱으로 배포된 주소에서 실행해야 합니다',true); return; }\n  $('startBtn').disabled=true; setMsg('던전 문을 여는 중...');\n  google.script.run.withSuccessHandler(qs=>{\n    if(!qs||!qs.length){ setMsg('문제가 없습니다. 시트를 확인하세요.',true); $('startBtn').disabled=false; return; }\n    questions=shuffle(qs).map(q=>({q:q.q,a:q.a,choices:makeChoices(q,qs)}));\n    mode='game'; hero.x=130; show('game'); renderHearts(); enterRoom(true);\n  }).withFailureHandler(e=>{ setMsg('불러오기 실패: '+e.message,true); $('startBtn').disabled=false; }).getQuestions();\n}\nfunction makeChoices(q,all){ const others=shuffle([...new Set(all.map(x=>x.a).filter(a=>a!==q.a))]).slice(0,3); return shuffle([q.a,...others]); }\n\n/* ================= 진행 ================= */\nasync function enterRoom(first){\n  if(idx>=questions.length){ endGame(true); return; }\n  const isBoss=idx===questions.length-1, m=isBoss?BOSS:MONSTERS[idx%MONSTERS.length];\n  Object.assign(mon,{type:m.type,name:m.name,hpShown:1,alpha:1,scale:1,flash:0,rot:0,state:'idle',fire:0,x:W+120});\n  hero.state='run';\n  const p1=tween(bg,{scroll:bg.scroll+420},first?900:1200,easeInOut);\n  const p2=tween(mon,{x:isBoss?480:500},first?900:1200,easeInOut);\n  for(let i=0;i\u003c4;i++){ sfx.step(); await wait(first?220:300); }\n  await Promise.all([p1,p2]); hero.state='idle';\n  if(isBoss){ shake.mag=14; sfx.die(); spawn(mon.x,FLOOR-60,30,['#ff9a2b','#ffe07a','#ff3e3e'],5); }\n  showQuestion();\n}\nfunction showQuestion(){\n  locked=false; const q=questions[idx];\n  $('qText').textContent=q.q; $('feedback').textContent=''; $('feedback').className='feedback';\n  const box=$('choices'); box.innerHTML='';\n  q.choices.forEach((c,i)=>{ const b=document.createElement('button'); b.className='choice'; b.dataset.value=c; b.innerHTML='\u003cem>'+'ABCD'[i]+'\u003c/em>'; b.appendChild(document.createTextNode(c)); b.addEventListener('click',()=>answer(b,c)); box.appendChild(b); });\n  startTimer();\n}\nfunction startTimer(){ clearInterval(timer); timeLeft=TIME_LIMIT; drawTimer(); timer=setInterval(()=>{ timeLeft--; drawTimer(); if(timeLeft\u003c=5&&timeLeft>0) sfx.tick(); if(timeLeft\u003c=0){ clearInterval(timer); timeout(); } },1000); }\nfunction drawTimer(){ const b=$('tbar'); b.style.width=(timeLeft/TIME_LIMIT*100)+'%'; b.classList.toggle('warn',timeLeft\u003c=5); }\nfunction reveal(correct){ document.querySelectorAll('.choice').forEach(b=>{ b.disabled=true; b.classList.add(b.dataset.value===correct?'correct':'dim'); }); }\nfunction updateHud(){ $('score').textContent=score; $('combo').textContent='콤보 '+combo; $('combo').classList.add('hot'); setTimeout(()=>$('combo').classList.remove('hot'),500); }\nfunction renderHearts(){ let h=''; for(let i=0;i\u003cMAX_HP;i++) h+='\u003cspan class=\"'+(i\u003chp?'':'lost')+'\">❤️\u003c/span>'; $('hearts').innerHTML=h; }\n\nasync function answer(btn,picked){\n  if(locked) return; locked=true; clearInterval(timer);\n  const q=questions[idx]; reveal(q.a);\n  if(picked===q.a){\n    combo++; maxCombo=Math.max(maxCombo,combo); correctCount++;\n    const gained=Math.round((100+timeLeft*10)*(1+Math.min(combo-1,5)*0.2)); score+=gained;\n    $('feedback').textContent=combo>=3?'🔥 '+combo+'콤보! 치명타!':'⚔️ 정답! 공격!'; $('feedback').classList.add('good'); updateHud();\n    await heroAttack(gained); idx++; await wait(300); enterRoom(false);\n  } else {\n    btn.classList.remove('dim'); btn.classList.add('wrong');\n    await monsterAttack('❌ 오답! 정답은 \"'+q.a+'\"');\n    if(hp>0){ idx++; await wait(300); enterRoom(false); }\n  }\n}\nasync function timeout(){ if(locked) return; locked=true; const q=questions[idx]; reveal(q.a); await monsterAttack('⏰ 시간 초과! 정답은 \"'+q.a+'\"'); if(hp>0){ idx++; await wait(300); enterRoom(false); } }\n\nasync function heroAttack(gained){\n  const isBoss=mon.type==='dragon', hx=hero.x, target=mon.x-(isBoss?120:80);\n  hero.state='attack'; hero.atk=0;\n  await tween(hero,{x:target},260,easeIn);\n  const swing=tween(hero,{atk:1},420,linear);\n  await wait(150);\n  sfx.slash(); mon.flash=1; shake.mag=isBoss?18:12;\n  spawn(mon.x-20,FLOOR-50,26,['#fff','#ffe07a','#ff9a2b','#ffffff'],6);\n  floatText(mon.x,FLOOR-110,'-'+gained,'#ffb347');\n  tween(mon,{hpShown:0},350,easeOut); tween(mon,{x:mon.x+22},120,easeOut);\n  await swing;\n  sfx.die(); spawn(mon.x,FLOOR-40,30,isBoss?['#ff3e3e','#ff9a2b','#7a1a1a']:['#9a9cb8','#ffffff','#5a5a7a'],4,0.15);\n  await Promise.all([tween(mon,{alpha:0,scale:isBoss?1.15:0.6,rot:isBoss?0.4:1.2},520,easeIn), tween(hero,{x:hx},380,easeOut)]);\n  hero.state='idle'; hero.atk=0;\n}\nasync function monsterAttack(msg){\n  const isBoss=mon.type==='dragon', mx=mon.x; combo=0; mon.state='attack';\n  if(isBoss){ mon.fire=0; await tween(mon,{fire:1},300,easeOut); spawn(hero.x+20,FLOOR-60,20,['#ff9a2b','#ffe07a','#ff3e3e'],4); }\n  else { await tween(mon,{x:hero.x+70},240,easeIn); }\n  sfx.hurt(); hero.flash=1; shake.mag=16; spawn(hero.x,FLOOR-50,18,['#ff3e6c','#ff8c5a','#fff'],5);\n  floatText(hero.x,FLOOR-110,'-1 HP','#ff3e6c');\n  hp--; renderHearts(); updateHud(); $('feedback').textContent=msg; $('feedback').classList.add('bad');\n  tween(hero,{x:hero.x-16},100,easeOut).then(()=>tween(hero,{x:hero.x+16},300,easeOut));\n  await wait(450);\n  if(isBoss) tween(mon,{fire:0},300,linear); else await tween(mon,{x:mx},300,easeOut);\n  mon.state='idle';\n  if(hp\u003c=0){ await wait(400); endGame(false); }\n}\n\n/* ================= 종료 ================= */\nfunction endGame(cleared){\n  clearInterval(timer);\n  const bonus=cleared?300+hp*100:0; score+=bonus;\n  endResult={cleared}; mode='end'; hero.x=200; hero.flash=0; hero.alpha=1;\n  if(cleared){ hero.state='idle'; particles=[]; spawn(320,FLOOR-120,60,['#ffe07a','#ffb347','#fff','#3ddc97'],6,0.08); sfx.win(); }\n  else { hero.state='idle'; hero.alpha=0.5; Object.assign(mon,{x:440,alpha:1,scale:1,rot:0,fire:0,hpShown:1}); sfx.lose(); }\n  $('resultTitle').textContent=cleared?'🏆 던전 클리어!':'💀 던전에서 쓰러졌다...';\n  $('resultSub').textContent=cleared?playerName+' 모험가, 드래곤을 쓰러뜨렸다! 보너스 +'+bonus:playerName+' 모험가, 다음엔 더 깊이 들어가보자!';\n  $('finalScore').textContent=score; $('sCorrect').textContent=correctCount+'/'+questions.length; $('sCombo').textContent=maxCombo; $('sHp').textContent=hp;\n  show('result');\n  google.script.run.withSuccessHandler(renderRank).withFailureHandler(()=>{ $('rankList').innerHTML='\u003cli>저장 실패 — 선생님께 알려주세요\u003c/li>'; })\n    .saveResult({name:playerName,score:score,correct:correctCount,total:questions.length,maxCombo:maxCombo,hp:hp,cleared:cleared});\n}\nfunction renderRank(list){\n  if(!list||!list.length){ $('rankList').innerHTML='\u003cli>아직 기록이 없습니다\u003c/li>'; return; }\n  $('rankList').innerHTML='';\n  list.forEach(r=>{ const li=document.createElement('li'); if(r.name===playerName&&r.score===score) li.className='me'; const n=document.createElement('span'); n.textContent=r.name; const s=document.createElement('span'); s.textContent=r.score+'점'; li.appendChild(n); li.appendChild(s); $('rankList').appendChild(li); });\n}\n$('startBtn').addEventListener('click',startGame);\n$('retryBtn').addEventListener('click',()=>location.reload());\n$('name').addEventListener('keydown',e=>{ if(e.key==='Enter') startGame(); });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>","feedback_code.gs":"/**\n * 연수 소감 나눔함 웹앱 — 서버 코드 (Code.gs)\n *\n * 시트 구조: A열 이름(소속) | B열 [소감] 또는 [질문] + 내용 | C열 제출 일시\n *\n * 사용 방법\n *   1) 스프레드시트 → 확장 프로그램 → Apps Script\n *   2) 이 코드를 Code.gs에 붙여넣기\n *   3) + → HTML로 'index' 파일을 만들어 화면 코드 붙여넣기\n *   4) 배포 → 새 배포 → 웹 앱\n *      - 다음 사용자 인증 정보로 실행: 나\n *      - 액세스 권한이 있는 사용자: 모든 사용자\n *   5) 발급된 URL(…/exec)을 QR코드로 만들어 참가자에게 공유\n */\n\n// 웹앱 주소로 접속하면 index.html 화면을 보여줌\nfunction doGet() {\n  return HtmlService.createHtmlOutputFromFile('index')\n    .setTitle('연수 소감 나눔함')\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1');\n}\n\n// 화면에서 제출 버튼을 누르면 호출되는 함수\nfunction submitData(name, content) {\n  name = String(name || '').trim();\n  content = String(content || '').trim();\n  if (!name || !content) {\n    throw new Error('이름과 내용을 모두 입력해 주세요.');\n  }\n\n  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];\n\n  // A열: 이름, B열: 내용, C열: 제출 일시 — 맨 아래 행에 추가\n  sheet.appendRow([\n    safe_(name),\n    safe_(content),\n    Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm:ss')\n  ]);\n\n  return '제출 완료';\n}\n\n// '='로 시작하는 글자가 수식으로 바뀌지 않도록 앞에 ' 를 붙임\nfunction safe_(text) {\n  return /^[=+\\-@]/.test(text) ? \"'\" + text : text;\n}\n","emotion_index.html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n  \u003cbase target=\"_top\">\n  \u003cmeta charset=\"UTF-8\">\n  \u003cstyle>\n    * { box-sizing: border-box; }\n    body {\n      margin: 0; min-height: 100vh; padding: 18px;\n      font-family: 'Malgun Gothic', sans-serif;\n      background: linear-gradient(180deg, #fff4d6 0%, #ffe3ec 100%);\n      display: flex; align-items: center; justify-content: center;\n    }\n    .diary {\n      width: 100%; max-width: 380px; background: #fffdf8;\n      border-radius: 26px; padding: 26px 22px 22px;\n      box-shadow: 0 14px 0 -6px #f3c6d3, 0 18px 40px rgba(180, 90, 120, .18);\n      border: 3px solid #3d3355;\n    }\n    .date { font-size: 13px; color: #8a7f99; text-align: right; }\n    h1 { margin: 6px 0 2px; font-size: 25px; color: #3d3355; }\n    .sub { margin: 0 0 18px; color: #7b6f8f; font-size: 14px; }\n    .label { display: block; font-weight: bold; color: #3d3355; margin: 16px 0 8px; font-size: 15px; }\n    input[type=\"text\"] {\n      width: 100%; padding: 13px 14px; font-size: 16px; border-radius: 14px;\n      border: 2px solid #d8d0e6; background: #fff; outline: none;\n    }\n    input[type=\"text\"]:focus { border-color: #8c6fd1; }\n    /* 마음 날씨 버튼 5개 */\n    .weather { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }\n    .weather button {\n      border: 2px solid #e6dff0; background: #fff; border-radius: 14px; padding: 8px 2px;\n      font-size: 26px; cursor: pointer; line-height: 1.1; font-family: inherit;\n    }\n    .weather button span { display: block; font-size: 11.5px; color: #6b6080; margin-top: 4px; }\n    .weather button.picked { border-color: #8c6fd1; background: #f1ebff; transform: translateY(-2px); }\n    .send {\n      width: 100%; margin-top: 22px; padding: 15px; font-size: 17px; font-weight: bold;\n      border: 3px solid #3d3355; border-radius: 16px; background: #ffd23f; color: #3d3355;\n      cursor: pointer; box-shadow: 0 5px 0 #3d3355; font-family: inherit;\n    }\n    .send:active { transform: translateY(3px); box-shadow: 0 2px 0 #3d3355; }\n    .send:disabled { background: #eee; cursor: default; }\n    #message { min-height: 24px; margin-top: 16px; text-align: center; font-weight: bold; font-size: 15px; }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"diary\">\n    \u003cdiv class=\"date\" id=\"today\">\u003c/div>\n    \u003ch1>🎒 오늘의 마음 일기\u003c/h1>\n    \u003cp class=\"sub\">지금 내 마음은 어떤 날씨인가요?\u003c/p>\n\n    \u003clabel class=\"label\" for=\"studentName\">내 이름\u003c/label>\n    \u003cinput type=\"text\" id=\"studentName\" placeholder=\"이름을 적어 주세요\">\n\n    \u003cspan class=\"label\">마음 날씨 고르기\u003c/span>\n    \u003cdiv class=\"weather\" id=\"weather\">\n      \u003cbutton type=\"button\" data-mood=\"☀️ 맑음\">☀️\u003cspan>맑음\u003c/span>\u003c/button>\n      \u003cbutton type=\"button\" data-mood=\"🌤️ 조금 맑음\">🌤️\u003cspan>조금 맑음\u003c/span>\u003c/button>\n      \u003cbutton type=\"button\" data-mood=\"☁️ 흐림\">☁️\u003cspan>흐림\u003c/span>\u003c/button>\n      \u003cbutton type=\"button\" data-mood=\"🌧️ 비\">🌧️\u003cspan>비\u003c/span>\u003c/button>\n      \u003cbutton type=\"button\" data-mood=\"⛈️ 천둥\">⛈️\u003cspan>천둥\u003c/span>\u003c/button>\n    \u003c/div>\n\n    \u003clabel class=\"label\" for=\"reason\">왜 그런 날씨일까요? (한 줄)\u003c/label>\n    \u003cinput type=\"text\" id=\"reason\" placeholder=\"예: 체육 시간에 골을 넣었어요\">\n\n    \u003cbutton class=\"send\" id=\"sendBtn\" onclick=\"submitData()\">일기 보내기 ✉️\u003c/button>\n    \u003cdiv id=\"message\">\u003c/div>\n  \u003c/div>\n\n  \u003cscript>\n    var mood = '';\n    document.getElementById('today').textContent =\n      new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });\n\n    // 날씨 버튼을 누르면 하나만 선택되도록\n    document.getElementById('weather').addEventListener('click', function (e) {\n      var btn = e.target.closest('button');\n      if (!btn) return;\n      document.querySelectorAll('#weather button').forEach(function (b) { b.classList.remove('picked'); });\n      btn.classList.add('picked');\n      mood = btn.dataset.mood;\n    });\n\n    function submitData() {\n      var name = document.getElementById('studentName').value.trim();\n      var reason = document.getElementById('reason').value.trim();\n      var msg = document.getElementById('message');\n      var btn = document.getElementById('sendBtn');\n\n      if (!name || !mood) {\n        msg.style.color = '#d6336c';\n        msg.textContent = '이름과 마음 날씨를 골라 주세요! 🙏';\n        return;\n      }\n\n      // 시트 B열에는 \"☀️ 맑음 - 이유\" 형태로 저장\n      var emotion = reason ? mood + ' - ' + reason : mood;\n      msg.style.color = '#6b5bd2';\n      msg.textContent = '선생님께 일기를 보내는 중... 📮';\n      btn.disabled = true;\n\n      // Code.gs의 saveEmotion 함수 실행\n      google.script.run\n        .withSuccessHandler(function (response) {\n          msg.style.color = '#2b8a3e';\n          msg.textContent = response;\n          document.getElementById('studentName').value = '';\n          document.getElementById('reason').value = '';\n          document.querySelectorAll('#weather button').forEach(function (b) { b.classList.remove('picked'); });\n          mood = '';\n          btn.disabled = false;\n        })\n        .withFailureHandler(function (error) {\n          msg.style.color = '#d6336c';\n          msg.textContent = '앗, 다시 한 번 눌러 주세요. (' + error.message + ')';\n          btn.disabled = false;\n        })\n        .saveEmotion(name, emotion);\n    }\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n","share_code.gs":"/**\n * '함께 공유' 게시판 백엔드 — 구글 시트 + Apps Script 웹앱\n *\n * 설치 (강사 1회)\n *   1) 새 구글 시트 → 확장 프로그램 → Apps Script → 이 코드 붙여넣고 저장\n *   2) 배포 → 새 배포 → 유형: 웹 앱\n *      - 다음 사용자 인증 정보로 실행: 나\n *      - 액세스 권한이 있는 사용자: 모든 사용자\n *   3) 발급된 웹 앱 URL(…/exec)을 실습 웹앱 index.html의 SHARE_API_URL에 붙여넣기\n *\n * 시트 '공유' 구조: A 등록일시 | B 이름(소속) | C 앱 이름 | D 링크 | E 소개 | F 도구 | G 숨김\n *   → 부적절한 글은 G열에 X를 입력하면 게시판에서 숨겨집니다.\n */\n\nconst SHEET_NAME = '공유';\nconst TOOLS = ['Apps Script', 'AppSheet', 'Gemini Canvas', 'AI Studio', 'Antigravity', '기타'];\nconst MAX_ITEMS = 300;\n\n// 목록 조회: GET …/exec\nfunction doGet() {\n  const sheet = getSheet_();\n  const lastRow = sheet.getLastRow();\n  if (lastRow \u003c 2) return json_({ ok: true, items: [] });\n\n  const items = sheet.getRange(2, 1, lastRow - 1, 7).getValues()\n    .filter(r => String(r[6]).toUpperCase() !== 'X')          // 숨김 처리된 글 제외\n    .map(r => ({\n      createdAt: r[0] instanceof Date ? r[0].toISOString() : String(r[0]),\n      name: String(r[1]), title: String(r[2]), url: String(r[3]),\n      description: String(r[4]), tool: String(r[5])\n    }))\n    .reverse()                                                // 최신 글이 위로\n    .slice(0, MAX_ITEMS);\n\n  return json_({ ok: true, items: items });\n}\n\n// 새 글 등록: POST …/exec (본문은 JSON 문자열)\nfunction doPost(e) {\n  try {\n    const data = JSON.parse((e && e.postData && e.postData.contents) || '{}');\n    const name = clean_(data.name, 40);\n    const title = clean_(data.title, 60);\n    const url = clean_(data.url, 500);\n    const description = clean_(data.description, 300);\n    const tool = TOOLS.includes(data.tool) ? data.tool : '기타';\n\n    if (!name || !title || !url) throw new Error('이름, 앱 이름, 링크는 꼭 입력해 주세요.');\n    if (!/^https:\\/\\/\\S+$/.test(url)) throw new Error('링크는 https:// 로 시작해야 합니다.');\n\n    const lock = LockService.getScriptLock();\n    lock.waitLock(10000);\n    try {\n      getSheet_().appendRow([new Date(), safe_(name), safe_(title), url, safe_(description), tool, '']);\n    } finally {\n      lock.releaseLock();\n    }\n    return json_({ ok: true });\n  } catch (err) {\n    return json_({ ok: false, error: err.message });\n  }\n}\n\nfunction getSheet_() {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  let sheet = ss.getSheetByName(SHEET_NAME);\n  if (!sheet) {\n    sheet = ss.insertSheet(SHEET_NAME);\n    sheet.appendRow(['등록일시', '이름(소속)', '앱 이름', '링크', '소개', '도구', '숨김']);\n    sheet.getRange(1, 1, 1, 7).setFontWeight('bold').setBackground('#e8f0fe');\n    sheet.setFrozenRows(1);\n  }\n  return sheet;\n}\n\n// 앞뒤 공백 제거 + 길이 제한\nfunction clean_(value, maxLength) {\n  return String(value || '').trim().slice(0, maxLength);\n}\n\n// '='로 시작하는 글자가 수식으로 바뀌지 않도록 앞에 ' 를 붙임\nfunction safe_(text) {\n  return /^[=+\\-@]/.test(text) ? \"'\" + text : text;\n}\n\nfunction json_(obj) {\n  return ContentService.createTextOutput(JSON.stringify(obj))\n    .setMimeType(ContentService.MimeType.JSON);\n}\n","emotion_code.gs":"/**\n * 우리 반 감정일기 웹앱 — 서버 코드 (Code.gs)\n * 시트 구조: A열 이름 | B열 오늘의 기분(마음 날씨 - 이유) | C열 오늘의 일시 (1행 머리글)\n */\n\n// 웹앱 주소로 접속하면 index.html 화면을 보여줌\nfunction doGet() {\n  return HtmlService.createHtmlOutputFromFile('index')\n    .setTitle('오늘의 마음 일기')\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1'); // 휴대폰 화면 대응\n}\n\n// 화면에서 [일기 보내기]를 누르면 실행되는 함수\nfunction saveEmotion(name, emotion) {\n  name = String(name || '').trim();\n  emotion = String(emotion || '').trim();\n  if (!name || !emotion) {\n    throw new Error('이름과 기분을 모두 적어 주세요.'); // 화면의 실패 처리로 전달됨\n  }\n\n  // 첫 번째 시트의 맨 아래에 한 줄 추가\n  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];\n  const now = Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm:ss');\n  sheet.appendRow([safe_(name), safe_(emotion), now]);\n\n  return name + ', 오늘의 마음 일기가 선생님께 도착했어요! 🌈';\n}\n\n// '='로 시작하는 글자가 수식으로 바뀌지 않도록 앞에 ' 를 붙임\nfunction safe_(text) {\n  return /^[=+\\-@]/.test(text) ? \"'\" + text : text;\n}\n","mail.gs":"/**\n * 구글폼 신청자에게 '신청 완료' 확인 메일 자동 발송\n *\n * 시트 구조 (폼 응답 시트)\n *   A열: 타임스탬프   B열: 신청자 이름   C열: 이메일 주소\n *\n * 작동 방식\n *   폼이 제출되는 순간 → 설치형 트리거가 onFormSubmit 실행 → 해당 응답자에게 메일 발송\n *\n * ⚠ 반드시 '설치형 트리거'로 등록해야 메일이 발송됩니다.\n *   (트리거 메뉴 → + 트리거 추가 → 함수: onFormSubmit,\n *    이벤트 소스: 스프레드시트에서, 이벤트 유형: 양식 제출 시)\n */\n\n// 폼 제출 시 자동 실행되는 함수\nfunction onFormSubmit(e) {\n  let name, email;\n\n  if (e && e.values) {\n    // ① 정상 경로: 폼 제출 → 트리거 실행\n    // e.values: 방금 제출된 응답 한 줄 (A열 = e.values[0], B열 = e.values[1], C열 = e.values[2])\n    name = e.values[1];   // B열: 이름\n    email = e.values[2];  // C열: 이메일\n  } else {\n    // ② 테스트 경로: 편집기에서 ▶로 직접 실행한 경우\n    //    (e가 없으므로 시트의 맨 마지막 응답을 대신 사용)\n    const sheet = SpreadsheetApp.getActiveSheet();\n    const lastRow = sheet.getLastRow();\n    if (lastRow \u003c 2) return;                          // 응답이 없으면 종료\n    name = sheet.getRange(lastRow, 2).getValue();     // B열\n    email = sheet.getRange(lastRow, 3).getValue();    // C열\n  }\n\n  email = String(email || '').trim();\n  if (!email.includes(\"@\")) return;                   // 이메일이 없으면 발송하지 않음\n\n  sendConfirmMail_(email, name);\n}\n\n// 확인 메일 보내기: 글자만 보이는 메일 환경을 위한 body + 꾸민 htmlBody\nfunction sendConfirmMail_(email, name) {\n  const subject = \"[AI 활용 연수] 참가 신청 완료 안내\";\n  const body = name + \"님 AI 활용 연수 참가 신청이 완료되었습니다. 감사합니다.\";\n  MailApp.sendEmail(email, subject, body, {\n    name: \"AI 활용 연수 운영팀\",                 // 보낸 사람 이름\n    htmlBody: buildMailHtml_(name)\n  });\n}\n\n// 메일 본문 디자인 (HTML)\nfunction buildMailHtml_(name) {\n  const safeName = String(name).replace(/[\u003c>&\"]/g, \"\");   // 이름에 HTML 기호가 들어가지 않게\n  return `\n  \u003cdiv style=\"font-family:'Malgun Gothic',sans-serif;background:#f3f1fa;padding:24px\">\n    \u003cdiv style=\"max-width:480px;margin:0 auto;background:#ffffff;border-radius:14px;overflow:hidden\">\n      \u003cdiv style=\"background:#5b3fa8;color:#ffffff;padding:20px 24px;font-size:18px;font-weight:bold\">\n        ✅ 참가 신청이 완료되었습니다\n      \u003c/div>\n      \u003cdiv style=\"padding:22px 24px;color:#2b2540;font-size:15px;line-height:1.7\">\n        \u003cb>${safeName}\u003c/b>님, AI 활용 연수 참가 신청이 완료되었습니다.\u003cbr>\n        연수 당일 안내는 이 메일 주소로 다시 보내 드립니다. 감사합니다.\n      \u003c/div>\n      \u003cdiv style=\"padding:12px 24px;background:#faf9fd;color:#8a84a3;font-size:12px\">\n        이 메일은 신청서 제출 시 자동으로 발송되었습니다.\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>`;\n}\n\n/**\n * (보조) 이미 쌓여 있는 신청자 전원에게 한 번에 발송\n *  - 트리거를 설정하기 전에 접수된 응답을 처리할 때 ▶로 직접 실행\n *  - D열에 '발송완료'를 기록해 중복 발송을 막음\n */\nfunction sendToExisting() {\n  const sheet = SpreadsheetApp.getActiveSheet();\n  const lastRow = sheet.getLastRow();\n\n  for (let row = 2; row \u003c= lastRow; row++) {\n    const name = sheet.getRange(row, 2).getValue();     // B열\n    const email = String(sheet.getRange(row, 3).getValue()).trim(); // C열\n    const done = sheet.getRange(row, 4).getValue();     // D열: 발송 여부\n\n    if (!email.includes(\"@\") || done === \"발송완료\") continue;  // 건너뛰기\n\n    sendConfirmMail_(email, name);\n    sheet.getRange(row, 4).setValue(\"발송완료\");        // 중복 방지 표시\n  }\n}\n","grades.gs":"/**\n * [심화] 성적 관리 메뉴 — 반별 시트 생성 · 점수 분류 · 색상 표시\n * 시트를 새로고침하면 상단에 [📊 성적 관리] 메뉴가 생깁니다.\n * 반 시트 구조: A열 학번 | B열 이름 | C열 점수 (1행 머리글, 시트 이름은 '○반')\n */\n\nconst CATEGORIES = [\n  { label: '90점 미만', max: 90, color: '#7e57c2' },\n  { label: '80점 미만', max: 80, color: '#ef6c00' },\n  { label: '70점 미만', max: 70, color: '#c62828' }\n];\n\n// ✅ 단순 트리거: 시트가 열릴 때 메뉴 만들기\nfunction onOpen() {\n  SpreadsheetApp.getUi()\n    .createMenu('📊 성적 관리')\n    .addItem('① 연습용 반별 시트 만들기', 'createClassSheets')\n    .addSeparator()\n    .addItem('② 점수 분류 (90 / 80 / 70점 미만)', 'classifyScores')\n    .addItem('③ 점수별 색상 표시', 'applyConditionalFormat')\n    .addToUi();\n}\n\n// ① 1~7반, 반마다 20명의 가상 점수표 만들기 (다시 실행하면 새로 만듦)\nfunction createClassSheets() {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  const totalClasses = 7;\n  const studentsPerClass = 20;\n\n  for (let c = 1; c \u003c= totalClasses; c++) {\n    const sheet = resetSheet_(ss, `${c}반`);      // 이미 있으면 내용을 비우고 다시 사용\n    sheet.getRange(1, 1, 1, 3).setValues([['학번', '이름', '점수']])\n      .setBackground('#3949ab').setFontColor('#ffffff').setFontWeight('bold');\n\n    const rows = [];\n    for (let s = 1; s \u003c= studentsPerClass; s++) {\n      const studentId = `${c}${String(s).padStart(2, '0')}`;\n      const score = Math.floor(Math.random() * 41) + 60;   // 60~100점\n      rows.push([studentId, getRandomName_(), score]);\n    }\n    sheet.getRange(2, 1, rows.length, 3).setValues(rows);\n    sheet.getRange(1, 1, studentsPerClass + 1, 3).setHorizontalAlignment('center');\n    sheet.setFrozenRows(1);\n  }\n\n  // 처음부터 있던 빈 시트(시트1)는 비어 있을 때만 삭제\n  const blank = ss.getSheetByName('시트1') || ss.getSheetByName('Sheet1');\n  if (blank && blank.getLastRow() === 0 && ss.getSheets().length > 1) ss.deleteSheet(blank);\n\n  SpreadsheetApp.getUi().alert('반별 시트 생성 완료!');\n}\n\n// ② 모든 '○반' 시트를 돌며 기준 점수 미만 학생을 분류 시트로 모으기\nfunction classifyScores() {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  const classSheets = ss.getSheets().filter(sh => sh.getName().endsWith('반'));\n\n  for (const cat of CATEGORIES) {\n    const resultSheet = resetSheet_(ss, cat.label);\n    resultSheet.getRange(1, 1, 1, 4).setValues([['반', '학번', '이름', '점수']])\n      .setBackground(cat.color).setFontColor('#ffffff').setFontWeight('bold');\n    resultSheet.setTabColor(cat.color);\n\n    const collected = [];\n    for (const sheet of classSheets) {\n      const lastRow = sheet.getLastRow();\n      if (lastRow \u003c 2) continue;\n      const data = sheet.getRange(2, 1, lastRow - 1, 3).getValues();\n      for (const [id, name, score] of data) {\n        // 빈 칸('')도 숫자 비교에서 0처럼 취급되므로 숫자일 때만 분류\n        if (typeof score === 'number' && score \u003c cat.max) {\n          collected.push([sheet.getName(), id, name, score]);\n        }\n      }\n    }\n\n    if (collected.length > 0) {\n      resultSheet.getRange(2, 1, collected.length, 4).setValues(collected);\n    } else {\n      resultSheet.getRange(2, 1).setValue('해당 학생 없음');\n    }\n    resultSheet.getRange(1, 1, Math.max(collected.length, 1) + 1, 4).setHorizontalAlignment('center');\n  }\n\n  SpreadsheetApp.getUi().alert('분류 완료! 새로 생긴 시트를 확인하세요.');\n}\n\n// ③ 점수(C열)에 따라 행 전체 색이 자동으로 바뀌는 조건부 서식\nfunction applyConditionalFormat() {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n\n  for (const sheet of ss.getSheets()) {\n    if (!sheet.getName().endsWith('반')) continue;\n    const lastRow = sheet.getLastRow();\n    if (lastRow \u003c 2) continue;\n\n    const range = sheet.getRange(`A2:C${lastRow}`);\n    const rule = (formula, color) => SpreadsheetApp.newConditionalFormatRule()\n      .whenFormulaSatisfied(formula).setBackground(color).setRanges([range]).build();\n\n    // 위에서부터 먼저 맞는 규칙이 적용되므로 순서가 중요\n    sheet.setConditionalFormatRules([\n      rule('=$C2>=90', '#d3f0dc'),   // 90점 이상 → 연두\n      rule('=$C2>=80', '#fff4c2'),   // 80점 이상 → 레몬\n      rule('=$C2>=70', '#ffe2cc'),   // 70점 이상 → 살구\n      rule('=AND($C2\u003c>\"\",$C2\u003c70)', '#ffd1d6')  // 70점 미만 → 분홍\n    ]);\n  }\n\n  SpreadsheetApp.getUi().alert('색상 표시 완료! 점수를 바꾸면 색도 함께 바뀝니다.');\n}\n\n// 이름이 같은 시트가 있으면 비우고, 없으면 새로 만들기\nfunction resetSheet_(ss, name) {\n  const sheet = ss.getSheetByName(name) || ss.insertSheet(name);\n  sheet.clear();\n  sheet.clearConditionalFormatRules();\n  return sheet;\n}\n\nfunction getRandomName_() {\n  const lastNames = ['김', '이', '박', '최', '정', '강', '조', '윤', '장', '임'];\n  const firstNames = ['민준', '서연', '지호', '수아', '도윤', '하은', '시우', '지아', '준서', '채원', '예준', '수빈'];\n  const pick = arr => arr[Math.floor(Math.random() * arr.length)];\n  return pick(lastNames) + pick(firstNames);\n}\n","register_code.gs":"/**\n * 연수 자동 등록부(출석 서명) 웹앱 — 서버 코드 (Code.gs)\n *\n * 시트 구조: A열 성함 | B열 일시 | C열 서명(셀 안 이미지)  (1행 머리글)\n *\n * 배포: 배포 → 새 배포 → 웹 앱\n *   - 다음 사용자 인증 정보로 실행: 나\n *   - 액세스 권한이 있는 사용자: 모든 사용자\n */\n\nconst TRAINING_NAME = '우리 학교 교원 연수';   // 화면 상단에 보일 연수 이름 (바꿔서 사용)\n\n// 웹앱 접속 시 index.html을 템플릿으로 열어 연수 이름을 끼워 넣음\nfunction doGet() {\n  const page = HtmlService.createTemplateFromFile('index');\n  page.trainingName = TRAINING_NAME;\n  return page.evaluate()\n    .setTitle(TRAINING_NAME + ' 출석 서명')\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1');\n}\n\n// 화면에서 [등록하기]를 누르면 실행: 이름 + 서명 이미지를 시트에 기록\nfunction submitSignature(name, signatureDataUrl) {\n  name = String(name || '').trim();\n  if (!name) throw new Error('성함을 입력해 주세요.');\n  if (!/^data:image\\/png;base64,/.test(signatureDataUrl || '')) {\n    throw new Error('서명을 해 주세요.');\n  }\n\n  // 여러 명이 동시에 제출해도 행이 섞이지 않도록 잠금\n  let order = 0;\n  const lock = LockService.getScriptLock();\n  lock.waitLock(10000);\n  try {\n    const sheet = getSheet_();\n    const row = sheet.getLastRow() + 1;\n    const now = Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm:ss');\n\n    sheet.getRange(row, 1, 1, 2).setValues([[safe_(name), now]]);\n\n    // 서명 PNG를 셀 안 이미지로 넣기\n    const image = SpreadsheetApp.newCellImage()\n      .setSourceUrl(signatureDataUrl)\n      .setAltTextTitle(name + ' 서명')\n      .build();\n    sheet.getRange(row, 3).setValue(image);\n    sheet.setRowHeight(row, 70);\n    order = row - 1;                        // 머리글을 뺀 등록 순서\n  } finally {\n    lock.releaseLock();\n  }\n\n  return name + ' 선생님, ' + order + '번째로 출석 등록되었습니다.';\n}\n\n// 첫 번째 시트를 사용하고, 비어 있으면 머리글을 만들어 줌\nfunction getSheet_() {\n  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];\n  if (sheet.getLastRow() === 0) {\n    sheet.appendRow(['성함', '일시', '서명']);\n    sheet.getRange(1, 1, 1, 3).setFontWeight('bold').setHorizontalAlignment('center')\n      .setBackground('#2f3480').setFontColor('#ffffff');\n    sheet.setColumnWidth(3, 200);\n    sheet.setFrozenRows(1);\n  }\n  return sheet;\n}\n\n// '='로 시작하는 글자가 수식으로 바뀌지 않도록 앞에 ' 를 붙임\nfunction safe_(text) {\n  return /^[=+\\-@]/.test(text) ? \"'\" + text : text;\n}\n","register_index.html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n  \u003cbase target=\"_top\">\n  \u003cmeta charset=\"UTF-8\">\n  \u003cstyle>\n    * { box-sizing: border-box; }\n    body {\n      margin: 0; min-height: 100vh; padding: 16px;\n      font-family: 'Malgun Gothic', sans-serif; color: #22253a;\n      background: #e8eaf3;\n      display: flex; align-items: center; justify-content: center;\n    }\n    .ticket { width: 100%; max-width: 440px; background: #fff; border-radius: 20px; overflow: hidden;\n              box-shadow: 0 12px 34px rgba(40, 46, 110, .16); position: relative; }\n    .top { background: #2f3480; color: #fff; padding: 22px 22px 18px; }\n    .top small { font-size: 12px; letter-spacing: .14em; opacity: .7; }\n    .top h1 { margin: 6px 0 4px; font-size: 21px; line-height: 1.35; }\n    .top p { margin: 0; font-size: 13px; opacity: .8; }\n    /* 표 사이 점선 절취선 */\n    .cut { height: 0; border-top: 2px dashed #c9cce0; margin: 0 18px; position: relative; }\n    .cut::before, .cut::after { content: ''; position: absolute; top: -11px; width: 20px; height: 20px;\n              border-radius: 50%; background: #e8eaf3; }\n    .cut::before { left: -28px; } .cut::after { right: -28px; }\n    .body { padding: 22px; }\n    label { display: block; font-size: 13px; font-weight: bold; color: #5a5f86; margin-bottom: 6px; }\n    input[type=\"text\"] { width: 100%; padding: 13px 14px; font-size: 18px; border: 2px solid #d9dbea;\n              border-radius: 12px; outline: none; font-family: inherit; }\n    input[type=\"text\"]:focus { border-color: #2f3480; }\n    .pad-head { display: flex; justify-content: space-between; align-items: end; margin: 18px 0 6px; }\n    .pad-head button { border: none; background: none; color: #e4572e; font-weight: bold; cursor: pointer;\n              font-size: 13px; font-family: inherit; }\n    canvas { width: 100%; height: 180px; display: block; border-radius: 12px; touch-action: none;\n             background: #fbfbfe; border: 2px solid #d9dbea; }\n    .submit { width: 100%; margin-top: 18px; padding: 16px; border: none; border-radius: 12px;\n              background: #e4572e; color: #fff; font-size: 17px; font-weight: bold; cursor: pointer; font-family: inherit; }\n    .submit:disabled { background: #f0b9a8; cursor: default; }\n    #msg { min-height: 20px; margin-top: 12px; text-align: center; color: #d02f2f; font-size: 14px; font-weight: bold; }\n    /* 완료 화면 (카드 위를 덮음) */\n    .done { position: absolute; inset: 0; background: #2f3480; color: #fff; display: none;\n            flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }\n    .done.show { display: flex; }\n    .done .mark { width: 84px; height: 84px; border-radius: 50%; background: #fff; color: #2f3480;\n            font-size: 46px; display: grid; place-items: center; margin-bottom: 18px; }\n    .done h2 { margin: 0 0 8px; font-size: 20px; line-height: 1.4; }\n    .done p { margin: 0; opacity: .8; font-size: 14px; }\n    .bar { width: 160px; height: 5px; background: rgba(255,255,255,.25); border-radius: 9px; margin-top: 20px; overflow: hidden; }\n    .bar i { display: block; height: 100%; width: 100%; background: #ffcf5c; }\n    .done.show .bar i { animation: shrink 3s linear forwards; }\n    @keyframes shrink { to { width: 0; } }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"ticket\">\n    \u003cdiv class=\"top\">\n      \u003csmall>ATTENDANCE\u003c/small>\n      \u003ch1>\u003c?= trainingName ?>\u003c/h1>\n      \u003cp id=\"today\">\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"cut\">\u003c/div>\n\n    \u003cdiv class=\"body\">\n      \u0
