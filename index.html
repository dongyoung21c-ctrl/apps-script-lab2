03clabel for=\"name\">성함\u003c/label>\n      \u003cinput type=\"text\" id=\"name\" placeholder=\"예: 홍길동\" autocomplete=\"off\">\n\n      \u003cdiv class=\"pad-head\">\n        \u003clabel style=\"margin:0\">서명\u003c/label>\n        \u003cbutton type=\"button\" onclick=\"clearPad()\">↺ 지우기\u003c/button>\n      \u003c/div>\n      \u003ccanvas id=\"pad\">\u003c/canvas>\n\n      \u003cbutton class=\"submit\" id=\"submitBtn\" onclick=\"submitForm()\">출석 서명 제출\u003c/button>\n      \u003cdiv id=\"msg\">\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"done\" id=\"done\">\n      \u003cdiv class=\"mark\">✓\u003c/div>\n      \u003ch2 id=\"doneText\">등록되었습니다\u003c/h2>\n      \u003cp>잠시 후 다음 분이 서명할 수 있습니다.\u003c/p>\n      \u003cdiv class=\"bar\">\u003ci>\u003c/i>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cscript>\n    var pad = document.getElementById('pad');\n    var ctx = pad.getContext('2d');\n    var drawing = false, signed = false;\n\n    document.getElementById('today').textContent =\n      new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });\n\n    // 캔버스를 화면 크기에 맞추기 (선명하게 그리기 위해 기기 배율 반영)\n    function setupPad() {\n      var ratio = window.devicePixelRatio || 1;\n      pad.width = pad.clientWidth * ratio;\n      pad.height = pad.clientHeight * ratio;\n      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);\n      clearPad();\n    }\n\n    function clearPad() {\n      ctx.fillStyle = '#ffffff';            // PNG 배경이 투명하지 않도록 흰색으로 채움\n      ctx.fillRect(0, 0, pad.width, pad.height);\n      ctx.strokeStyle = '#1b1e4b';\n      ctx.lineWidth = 3;\n      ctx.lineCap = 'round';\n      ctx.lineJoin = 'round';\n      signed = false;\n    }\n\n    function point(e) {\n      var r = pad.getBoundingClientRect();\n      return { x: e.clientX - r.left, y: e.clientY - r.top };\n    }\n\n    // 마우스 · 손가락 · 펜 모두 pointer 이벤트로 처리\n    pad.addEventListener('pointerdown', function (e) {\n      drawing = true;\n      pad.setPointerCapture(e.pointerId);\n      var p = point(e);\n      ctx.beginPath();\n      ctx.moveTo(p.x, p.y);\n    });\n    pad.addEventListener('pointermove', function (e) {\n      if (!drawing) return;\n      var p = point(e);\n      ctx.lineTo(p.x, p.y);\n      ctx.stroke();\n      signed = true;\n    });\n    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (type) {\n      pad.addEventListener(type, function () { drawing = false; });\n    });\n\n    // 시트에 넣기 좋게 가로 400px로 줄인 PNG 만들기\n    function signatureImage() {\n      var out = document.createElement('canvas');\n      out.width = 400;\n      out.height = Math.round(400 * pad.height / pad.width);\n      out.getContext('2d').drawImage(pad, 0, 0, out.width, out.height);\n      return out.toDataURL('image/png');\n    }\n\n    function submitForm() {\n      var msg = document.getElementById('msg');\n      var btn = document.getElementById('submitBtn');\n      var name = document.getElementById('name').value.trim();\n      msg.textContent = '';\n      if (!name) { msg.textContent = '성함을 입력해 주세요.'; return; }\n      if (!signed) { msg.textContent = '서명을 해 주세요.'; return; }\n\n      btn.disabled = true;\n      btn.textContent = '등록 중...';\n      google.script.run\n        .withSuccessHandler(function (text) {\n          document.getElementById('doneText').textContent = text;\n          document.getElementById('done').classList.add('show');\n          // 3초 뒤 다음 사람을 위해 초기화\n          setTimeout(function () {\n            document.getElementById('done').classList.remove('show');\n            document.getElementById('name').value = '';\n            clearPad();\n            btn.disabled = false;\n            btn.textContent = '출석 서명 제출';\n          }, 3000);\n        })\n        .withFailureHandler(function (err) {\n          msg.textContent = '등록 실패: ' + err.message;\n          btn.disabled = false;\n          btn.textContent = '출석 서명 제출';\n        })\n        .submitSignature(name, signatureImage());\n    }\n\n    setupPad();\n    // 화면 폭이 바뀔 때만 다시 맞춤 (휴대폰 키보드가 열릴 때 서명이 지워지지 않도록)\n    var lastWidth = pad.clientWidth;\n    window.addEventListener('resize', function () {\n      if (pad.clientWidth !== lastWidth) { lastWidth = pad.clientWidth; setupPad(); }\n    });\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n","gifted.gs":"/**\n * 2026 영재 이수자 명단 → 학교생활기록부 입력 문구 자동 생성\n *\n * 시트 구조 (1행은 머리글)\n *   A열: 이름 | B열: 학년 | C열: 구분 | D열: 영역 | E열: 이수 시간 | F열: 생성 문구\n *\n * 사용법\n *   1. [확장 프로그램] → [Apps Script]에 이 코드를 붙여넣고 저장\n *   2. 시트를 새로고침하면 상단에 [생기부 문구] 메뉴가 생김\n *   3. [생기부 문구] → [문구 생성] 클릭 (처음 한 번은 권한 승인 필요)\n */\n\n// ===== 설정 =====\nconst SHEET_NAME  = '';    // 대상 시트 탭 이름 (비워 두면 현재 보고 있는 시트)\nconst TOTAL_HOURS = 120;   // 과정 총 시간\nconst HEADER_ROWS = 1;     // 머리글 행 수\n// ================\n\n// 시트를 열 때 자동 실행되는 단순 트리거 → 상단 메뉴 만들기\nfunction onOpen() {\n  SpreadsheetApp.getUi()\n    .createMenu('생기부 문구')\n    .addItem('문구 생성', 'generateSentences')\n    .addItem('문구 지우기', 'clearSentences')\n    .addToUi();\n}\n\nfunction getTargetSheet_() {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  return (SHEET_NAME && ss.getSheetByName(SHEET_NAME)) || ss.getActiveSheet();\n}\n\n// 한 사람의 문구 만들기\nfunction makeSentence_(grade, type, area, hours) {\n  return `${type}에서 ${grade}학년 과정 ${area} 영역(${TOTAL_HOURS}시간) ${hours}시간을 이수함.`;\n}\n\nfunction generateSentences() {\n  const sheet = getTargetSheet_();\n  const lastRow = sheet.getLastRow();\n  if (lastRow \u003c= HEADER_ROWS) {\n    SpreadsheetApp.getUi().alert('데이터가 없습니다.');\n    return;\n  }\n\n  const numRows = lastRow - HEADER_ROWS;\n  const data = sheet.getRange(HEADER_ROWS + 1, 1, numRows, 5).getValues(); // A~E열을 한 번에 읽기\n\n  const isBlank = v => v === '' || v === null || v === undefined;\n  const output = data.map(([name, grade, type, area, hours]) => {\n    if ([name, grade, type, area, hours].some(isBlank)) return ['']; // 빈 행은 건너뛰기\n    return [makeSentence_(\n      String(grade).trim().replace(/학년$/, ''), // '2'와 '2학년' 모두 허용\n      String(type).trim(),\n      String(area).trim(),\n      Number(hours)\n    )];\n  });\n\n  sheet.getRange(HEADER_ROWS + 1, 6, numRows, 1)\n    .setValues(output)                                   // F열에 한 번에 쓰기\n    .setWrap(true).setFontColor('#1b4f8a');              // 긴 문장은 줄바꿈, 글자색 구분\n  sheet.getRange(HEADER_ROWS, 6).setBackground('#fff1c2').setFontWeight('bold');\n  SpreadsheetApp.getUi().alert(`${output.filter(r => r[0]).length}명의 문구를 생성했습니다.`);\n}\n\nfunction clearSentences() {\n  const sheet = getTargetSheet_();\n  const lastRow = sheet.getLastRow();\n  if (lastRow > HEADER_ROWS) {\n    sheet.getRange(HEADER_ROWS + 1, 6, lastRow - HEADER_ROWS, 1).clearContent();\n  }\n}\n","feedback_index.html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n  \u003cbase target=\"_top\">\n  \u003cmeta charset=\"UTF-8\">\n  \u003ctitle>연수 소감 나눔함\u003c/title>\n  \u003cstyle>\n    * { box-sizing: border-box; margin: 0; padding: 0; }\n    body {\n      font-family: 'Malgun Gothic', sans-serif; color: #1d2b2a;\n      background: #e9efe9; min-height: 100vh; padding: 0 0 32px;\n    }\n    /* 상단 띠 */\n    .band { background: #1f4d45; color: #fff; padding: 26px 20px 70px; }\n    .band .inner { max-width: 520px; margin: 0 auto; }\n    .band small { font-size: 12px; letter-spacing: .12em; opacity: .75; }\n    .band h1 { font-size: 24px; margin-top: 6px; }\n    .band p { font-size: 14px; opacity: .85; margin-top: 6px; line-height: 1.6; }\n    /* 메모지 카드 */\n    .note {\n      max-width: 520px; margin: -48px auto 0; background: #fffbea;\n      border-radius: 4px 4px 18px 4px; padding: 26px 22px 22px;\n      box-shadow: 0 10px 24px rgba(31, 77, 69, .18); position: relative;\n    }\n    .note::before {\n      content: ''; position: absolute; top: -10px; left: 50%; width: 90px; height: 22px;\n      transform: translateX(-50%) rotate(-2deg); background: rgba(160, 210, 190, .7);\n    }\n    .type { display: flex; gap: 8px; margin-bottom: 18px; }\n    .type button {\n      flex: 1; padding: 11px; border: 2px solid #1f4d45; background: transparent; color: #1f4d45;\n      border-radius: 999px; font-size: 15px; font-weight: bold; cursor: pointer; font-family: inherit;\n    }\n    .type button.on { background: #1f4d45; color: #fff; }\n    label { display: block; font-size: 14px; font-weight: bold; margin: 0 0 6px; }\n    input, textarea {\n      width: 100%; border: none; border-bottom: 2px solid #c9c2a3; background: transparent;\n      padding: 10px 2px; font-size: 16px; font-family: inherit; color: #1d2b2a; outline: none;\n    }\n    input:focus, textarea:focus { border-bottom-color: #1f4d45; }\n    textarea { height: 110px; resize: vertical; line-height: 1.7;\n      background-image: repeating-linear-gradient(transparent 0 26px, #efe7c6 26px 27px); }\n    .field { margin-bottom: 20px; }\n    .count { text-align: right; font-size: 12px; color: #8a8467; margin-top: 4px; }\n    #submitBtn {\n      width: 100%; padding: 15px; border: none; border-radius: 12px; background: #e8763a; color: #fff;\n      font-size: 16px; font-weight: bold; cursor: pointer; font-family: inherit;\n    }\n    #submitBtn:disabled { background: #d9c9bd; cursor: default; }\n    #message { margin-top: 14px; text-align: center; font-size: 14px; font-weight: bold; min-height: 20px; }\n    #message.success { color: #1f7a4f; }\n    #message.error { color: #c0392b; }\n    .footer { text-align: center; font-size: 12px; color: #6f7f7b; margin-top: 18px; }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"band\">\n    \u003cdiv class=\"inner\">\n      \u003csmall>TRAINING FEEDBACK\u003c/small>\n      \u003ch1>연수 소감 나눔함\u003c/h1>\n      \u003cp>오늘 배운 것 한 가지, 또는 강사에게 묻고 싶은 것을 메모지에 남겨 주세요.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"note\">\n    \u003cdiv class=\"type\" id=\"typeBox\">\n      \u003cbutton type=\"button\" class=\"on\" data-type=\"소감\">💬 소감\u003c/button>\n      \u003cbutton type=\"button\" data-type=\"질문\">❓ 질문\u003c/button>\n    \u003c/div>\n\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"name\">이름 (소속)\u003c/label>\n      \u003cinput type=\"text\" id=\"name\" maxlength=\"40\" placeholder=\"예: 홍길동 (○○초등학교)\">\n    \u003c/div>\n\n    \u003cdiv class=\"field\">\n      \u003clabel for=\"content\" id=\"contentLabel\">한 줄 소감\u003c/label>\n      \u003ctextarea id=\"content\" maxlength=\"200\" placeholder=\"예: 우리 반 감정일기를 내일 바로 써 보고 싶어요.\">\u003c/textarea>\n      \u003cdiv class=\"count\">\u003cspan id=\"len\">0\u003c/span> / 200\u003c/div>\n    \u003c/div>\n\n    \u003cbutton id=\"submitBtn\" onclick=\"handleSubmit()\">메모 붙이기\u003c/button>\n    \u003cdiv id=\"message\">\u003c/div>\n  \u003c/div>\n  \u003cp class=\"footer\">교원 연수 소감 · 질문 나눔\u003c/p>\n\n  \u003cscript>\n    var type = '소감';\n    var content = document.getElementById('content');\n\n    // 소감 / 질문 선택\n    document.getElementById('typeBox').addEventListener('click', function (e) {\n      var btn = e.target.closest('button');\n      if (!btn) return;\n      type = btn.dataset.type;\n      document.querySelectorAll('#typeBox button').forEach(function (b) { b.classList.toggle('on', b === btn); });\n      document.getElementById('contentLabel').textContent = type === '소감' ? '한 줄 소감' : '궁금한 점';\n    });\n\n    // 글자 수 표시\n    content.addEventListener('input', function () {\n      document.getElementById('len').textContent = content.value.length;\n    });\n\n    function handleSubmit() {\n      var name = document.getElementById('name').value.trim();\n      var text = content.value.trim();\n      var btn = document.getElementById('submitBtn');\n      var msg = document.getElementById('message');\n\n      msg.className = '';\n      if (!name || !text) {\n        msg.className = 'error';\n        msg.textContent = '이름과 내용을 모두 적어 주세요.';\n        return;\n      }\n\n      btn.disabled = true; // 중복 클릭 방지\n      btn.textContent = '붙이는 중...';\n\n      // 시트 B열에는 \"[소감] 내용\" 또는 \"[질문] 내용\" 형태로 저장\n      google.script.run\n        .withSuccessHandler(function () {\n          msg.className = 'success';\n          msg.textContent = '메모가 붙었습니다. 고맙습니다! 📌';\n          content.value = '';\n          document.getElementById('len').textContent = '0';\n          btn.disabled = false;\n          btn.textContent = '메모 붙이기';\n        })\n        .withFailureHandler(function (error) {\n          msg.className = 'error';\n          msg.textContent = '제출하지 못했습니다: ' + error.message;\n          btn.disabled = false;\n          btn.textContent = '메모 붙이기';\n        })\n        .submitData(name, '[' + type + '] ' + text);\n    }\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n","afterSchoolForm.gs":"/**\n * [독립형] 방과후 캠프 희망서(구글 설문지) 자동 생성\n * 실행 함수: buildSurvey\n */\n\nfunction buildSurvey() {\n  Logger.log(\"방과후 캠프 희망서를 만드는 중입니다...\");\n\n  // 1. 드라이브에 새 설문지 만들기\n  const form = FormApp.create(\"2026학년도 2학기 방과후 특기적성 캠프 희망서\");\n\n  // 2. 설문 안내문\n  form.setDescription(\n    \"학부모님 안녕하십니까. 11월에 운영할 방과후 특기적성 캠프의 수요를 조사하고자 합니다.\\n\" +\n    \"희망하는 강좌를 선택해 주시기 바랍니다.\\n\\n\" +\n    \"* 신청 기한: 2026년 10월 30일(금)까지\"\n  );\n  form.setProgressBar(true);\n  form.setConfirmationMessage(\"신청해 주셔서 감사합니다. 강좌 배정 결과는 11월 2일(월)에 안내해 드립니다.\");\n\n  // 3. 학생 정보 구역\n  form.addSectionHeaderItem().setTitle(\"1. 학생 정보\");\n\n  // 학생 성명 (필수, 단답형)\n  form.addTextItem()\n    .setTitle(\"학생 성명\")\n    .setHelpText(\"출석부와 대조할 수 있도록 정확한 이름을 적어 주세요.\")\n    .setRequired(true);\n\n  // 학년·반·번호 (필수, 단답형)\n  form.addTextItem()\n    .setTitle(\"학년 · 반 · 번호\")\n    .setHelpText(\"예: 6학년 1반 15번\")\n    .setRequired(true);\n\n  // 4. 강좌 선택 구역\n  form.addSectionHeaderItem().setTitle(\"2. 강좌 선택\");\n\n  // 수강 희망 강좌 (필수, 객관식)\n  form.addMultipleChoiceItem()\n    .setTitle(\"수강 희망 강좌\")\n    .setHelpText(\"가장 참여하고 싶은 강좌 한 가지를 골라 주세요.\")\n    .setChoiceValues([\n      \"드론 비행 조종 코스\",\n      \"파이썬 로봇 코딩 코스\",\n      \"태블릿 디지털 드로잉 코스\"\n    ])\n    .setRequired(true);\n\n  // 요청 사항 (선택, 장문형)\n  form.addParagraphTextItem()\n    .setTitle(\"담임 선생님께 전할 말씀 · 요청 사항\")\n    .setHelpText(\"귀가 방법, 준비물 문의 등 자유롭게 적어 주세요.\");\n\n  // 5. 개인정보 동의 (필수, 체크박스)\n  form.addCheckboxItem()\n    .setTitle(\"개인정보 수집·이용 동의\")\n    .setHelpText(\"수집 항목: 학생 성명, 학년·반·번호 / 이용 목적: 방과후 강좌 배정 / 보유 기간: 2026학년도 말까지\")\n    .setChoiceValues([\"위 내용에 동의합니다.\"])\n    .setRequired(true);\n\n  // 6. 교사용 / 배포용 주소를 로그에 출력\n  Logger.log(\"=========================================\");\n  Logger.log(\"🎈 설문지 생성 완료\");\n  Logger.log(\"▶ [교사용] 편집·응답 확인 주소: \" + form.getEditUrl());\n  Logger.log(\"▶ [배포용] 응답 제출 주소: \" + form.getPublishedUrl());\n  Logger.log(\"=========================================\");\n}\n","awards.gs":"/**\n * [독립형] 상장 자동 생성기\n * 학생 목록을 돌며 구글 문서 하나에 학생마다 한 페이지씩 상장을 만듭니다.\n * 실행 함수: makeAwardsOneDoc\n */\n\nconst AWARD_FONT = \"Nanum Myeongjo\";   // 구글 문서에서 쓸 수 있는 명조 글꼴\nconst AWARD_COLOR = \"#8a1c1c\";         // 제목 색 (진한 빨강)\n\nfunction makeAwardsOneDoc() {\n  const dateText = \"2026년 10월 15일\";\n  const schoolName = \"구글초등학교\";\n\n  // 상장을 받을 학생 목록\n  const students = [\n    { name: \"홍길동\", award: \"모범상\" },\n    { name: \"김철수\", award: \"우수상\" },\n    { name: \"이영희\", award: \"장려상\" },\n  ];\n\n  const doc = DocumentApp.create(\"2026 상장 모음\");\n  const body = doc.getBody();\n  body.setMarginTop(70).setMarginBottom(70).setMarginLeft(70).setMarginRight(70);\n\n  students.forEach((student, index) => {\n    if (index > 0) body.appendPageBreak();   // 두 번째 학생부터 새 페이지\n\n    // 상장 번호 (왼쪽 위)\n    addLine_(body, \"제 2026-\" + String(index + 1).padStart(3, \"0\") + \"호\", 11, { align: \"LEFT\", after: 40 });\n\n    // 제목과 구분선\n    addLine_(body, \"상    장\", 40, { bold: true, color: AWARD_COLOR, after: 6 });\n    body.appendHorizontalRule();\n    addLine_(body, \"\", 10, { after: 24 });\n\n    // 상 이름과 성명\n    addLine_(body, student.award, 26, { bold: true, after: 14 });\n    addLine_(body, \"성명   \" + student.name, 18, { after: 48 });\n\n    // 본문\n    addLine_(body,\n      \"위 학생은 학업과 생활 전반에 걸쳐\\n\" +\n      \"모범적인 자세로 꾸준히 노력하였기에\\n\" +\n      \"이 상장을 수여합니다.\", 15, { lineSpacing: 1.8, after: 70 });\n\n    // 날짜와 학교장\n    addLine_(body, dateText, 14, { after: 30 });\n    addLine_(body, schoolName + \"장\", 20, { bold: true });\n  });\n\n  doc.saveAndClose();\n\n  // 실행 로그에 결과와 문서 주소를 출력\n  Logger.log(\"✅ 완료! 총 \" + students.length + \"페이지 생성\");\n  Logger.log(\"🔗 문서 주소: \" + doc.getUrl());\n}\n\n// 문단 한 줄을 추가하고 글꼴·크기·정렬을 한 번에 지정\nfunction addLine_(body, text, size, opt) {\n  opt = opt || {};\n  const p = body.appendParagraph(text);\n  p.setAlignment(DocumentApp.HorizontalAlignment[opt.align || \"CENTER\"]);\n  p.setSpacingAfter(opt.after || 0);\n  if (opt.lineSpacing) p.setLineSpacing(opt.lineSpacing);\n  if (text) {\n    p.editAsText()\n      .setFontFamily(AWARD_FONT)\n      .setFontSize(size)\n      .setBold(!!opt.bold)\n      .setForegroundColor(opt.color || \"#222222\");\n  }\n  return p;\n}\n","game_code.gs":"/**\n * 게임형 문제 생성기 — 던전 퀴즈 (서버 코드 Code.gs)\n * 시트 구조: 첫 번째 시트 A열 문제 | B열 정답 (1행 머리글)\n * 결과는 '결과' 시트에 자동 저장 (없으면 새로 만듦)\n *\n * 배포: 배포 → 새 배포 → 웹 앱 (실행: 나 / 액세스: 모든 사용자)\n */\n\nconst QUESTION_SHEET = '';      // 문제 시트 탭 이름 (비워 두면 첫 번째 시트)\nconst RESULT_SHEET   = '결과';   // 결과 저장 시트 (없으면 자동 생성)\nconst GAME_TITLE     = '역사 던전 탐험';   // 화면 제목 (교과에 맞게 바꾸기)\n\n// 웹앱 접속 시 index.html을 열고 제목을 끼워 넣음\nfunction doGet() {\n  const t = HtmlService.createTemplateFromFile('index');\n  t.title = GAME_TITLE;\n  return t.evaluate()\n    .setTitle(GAME_TITLE)\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1')\n    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);\n}\n\nfunction getQuestionSheet_() {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  return (QUESTION_SHEET && ss.getSheetByName(QUESTION_SHEET)) || ss.getSheets()[0];\n}\n\n/** 문제 목록 반환: [{q, a}, ...] — 빈 행은 건너뜀 */\nfunction getQuestions() {\n  const sheet = getQuestionSheet_();\n  const lastRow = sheet.getLastRow();\n  if (lastRow \u003c 2) return [];\n  return sheet.getRange(2, 1, lastRow - 1, 2).getValues()\n    .filter(r => r[0] !== '' && r[1] !== '')\n    .map(r => ({ q: String(r[0]).trim(), a: String(r[1]).trim() }));\n}\n\n/** 게임 결과 저장 후 최신 순위 반환 */\nfunction saveResult(result) {\n  // 여러 학생이 동시에 저장해도 행이 섞이지 않도록 잠금\n  const lock = LockService.getScriptLock();\n  lock.waitLock(10000);\n  try {\n    const ss = SpreadsheetApp.getActiveSpreadsheet();\n    let sheet = ss.getSheetByName(RESULT_SHEET);\n    if (!sheet) {\n      sheet = ss.insertSheet(RESULT_SHEET);\n      sheet.appendRow(['제출 시각', '이름', '점수', '정답 수', '전체 문제', '최대 콤보', '남은 HP', '클리어']);\n      sheet.getRange(1, 1, 1, 8).setFontWeight('bold').setBackground('#e8eaf6');\n      sheet.setFrozenRows(1);\n    }\n    sheet.appendRow([\n      Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm:ss'),\n      safe_(String(result.name || '익명').slice(0, 20)),\n      Number(result.score) || 0,\n      Number(result.correct) || 0,\n      Number(result.total) || 0,\n      Number(result.maxCombo) || 0,\n      Number(result.hp) || 0,\n      result.cleared ? 'O' : 'X'\n    ]);\n  } finally {\n    lock.releaseLock();\n  }\n  return getRanking();\n}\n\n/** 상위 10명 순위 */\nfunction getRanking() {\n  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(RESULT_SHEET);\n  if (!sheet || sheet.getLastRow() \u003c 2) return [];\n  return sheet.getRange(2, 2, sheet.getLastRow() - 1, 2).getValues()\n    .map(r => ({ name: String(r[0]), score: Number(r[1]) || 0 }))\n    .sort((a, b) => b.score - a.score)\n    .slice(0, 10);\n}\n\n// '='로 시작하는 이름이 수식으로 바뀌지 않도록 앞에 ' 를 붙임\nfunction safe_(text) {\n  return /^[=+\\-@]/.test(text) ? \"'\" + text : text;\n}\n","counsel_stats.gs":"/**\n * 상담 일지 → 월별 · 유형별 통계 자동 집계\n * - 시트를 열면 [🗂 상담 도구] 메뉴가 생깁니다.\n *   ① 상담일지 시트 만들기 : 머리글 · 드롭다운 · 예시 기록(가상 데이터)을 넣습니다.\n *   ② 통계 새로 만들기     : '통계' 시트에 유형별 · 월별 건수, 연인원 · 실인원, 차트를 만듭니다.\n * - 학생 이름 대신 '학생 코드'(예: S-001)로 기록합니다. 코드와 이름을 잇는 표는 따로 보관하세요.\n */\n\nconst LOG_SHEET = '상담일지';\nconst STATS_SHEET = '통계';\nconst HEADERS = ['상담일', '학생 코드', '학년', '상담 대상', '상담 유형', '상담 방법', '회기', '후속 조치'];\nconst TYPES = ['학업', '교우관계', '가정', '정서', '진로', '학교생활', '기타'];\nconst TARGETS = ['학생', '학부모', '교사'];\nconst METHODS = ['대면', '전화', '온라인'];\nconst FOLLOWUPS = ['종결', '지속 상담', '외부 연계', '담임 협의'];\nconst INPUT_ROWS = 500; // 드롭다운을 걸어 둘 행 수\n\n// 시트를 열 때 메뉴 만들기 (단순 트리거)\nfunction onOpen() {\n  SpreadsheetApp.getUi()\n    .createMenu('🗂 상담 도구')\n    .addItem('① 상담일지 시트 만들기 (예시 포함)', 'setupLogSheet')\n    .addItem('② 통계 새로 만들기', 'buildStats')\n    .addToUi();\n}\n\n// ① 상담일지 시트 준비\nfunction setupLogSheet() {\n  const ss = SpreadsheetApp.getActive();\n  let sheet = ss.getSheetByName(LOG_SHEET);\n  const hasRecords = sheet && sheet.getLastRow() > 1;\n  if (!sheet) sheet = ss.insertSheet(LOG_SHEET, 0);\n\n  // 머리글\n  sheet.getRange(1, 1, 1, HEADERS.length).setValues([HEADERS])\n    .setFontWeight('bold').setBackground('#0f766e').setFontColor('#ffffff');\n  sheet.setFrozenRows(1);\n\n  // 날짜 형식과 드롭다운 (잘못된 값은 입력되지 않게)\n  sheet.getRange(2, 1, INPUT_ROWS).setNumberFormat('yyyy-mm-dd')\n    .setDataValidation(SpreadsheetApp.newDataValidation().requireDate().setAllowInvalid(false).build());\n  setList_(sheet.getRange(2, 4, INPUT_ROWS), TARGETS);\n  setList_(sheet.getRange(2, 5, INPUT_ROWS), TYPES);\n  setList_(sheet.getRange(2, 6, INPUT_ROWS), METHODS);\n  setList_(sheet.getRange(2, 8, INPUT_ROWS), FOLLOWUPS);\n\n  // 기존 기록이 없을 때만 예시 기록을 넣음 (실제 기록은 지우지 않음)\n  if (!hasRecords) {\n    const samples = sampleRows_();\n    sheet.getRange(2, 1, samples.length, HEADERS.length).setValues(samples);\n  }\n  sheet.autoResizeColumns(1, HEADERS.length);\n  ss.toast(hasRecords ? '기존 기록은 그대로 두고 서식만 적용했습니다.' : '예시 기록 36건을 넣었습니다.', '상담 도구');\n}\n\n// ② 통계 만들기\nfunction buildStats() {\n  const ss = SpreadsheetApp.getActive();\n  const log = ss.getSheetByName(LOG_SHEET);\n  if (!log || log.getLastRow() \u003c 2) {\n    SpreadsheetApp.getUi().alert('먼저 [① 상담일지 시트 만들기]를 실행하거나 기록을 입력해 주세요.');\n    return;\n  }\n  const tz = ss.getSpreadsheetTimeZone();\n  const monthOf = d => Utilities.formatDate(d, tz, 'yyyy-MM');\n\n  // 상담일(A)이 날짜이고 상담 유형(E)이 있는 행만 사용\n  const rows = log.getRange(2, 1, log.getLastRow() - 1, HEADERS.length).getValues()\n    .filter(r => r[0] instanceof Date && r[4] !== '');\n  if (!rows.length) {\n    SpreadsheetApp.getUi().alert('집계할 기록이 없습니다. 상담일과 상담 유형을 확인해 주세요.');\n    return;\n  }\n\n  const months = unique_(rows.map(r => monthOf(r[0]))).sort();\n  const types = TYPES.concat(unique_(rows.map(r => r[4])).filter(t => TYPES.indexOf(t) \u003c 0));\n\n  // 표 1) 상담 유형 × 월\n  const typeTable = [['상담 유형'].concat(months, ['합계'])];\n  types.forEach(type => {\n    const counts = months.map(m => rows.filter(r => r[4] === type && monthOf(r[0]) === m).length);\n    typeTable.push([type].concat(counts, [sum_(counts)]));\n  });\n  const monthTotals = months.map(m => rows.filter(r => monthOf(r[0]) === m).length);\n  typeTable.push(['합계'].concat(monthTotals, [rows.length]));\n\n  // 표 2) 월별 연인원(상담 건수) · 실인원(학생 코드 기준 중복 제외)\n  const personTable = [['월', '연인원 (상담 건수)', '실인원 (학생 코드 기준)']];\n  months.forEach(m => {\n    const inMonth = rows.filter(r => monthOf(r[0]) === m);\n    personTable.push([m, inMonth.length, uniqueCodes_(inMonth)]);\n  });\n  personTable.push(['전체', rows.length, uniqueCodes_(rows)]);\n\n  // 표 3~5) 상담 대상 · 방법 · 후속 조치별 건수\n  const countBy = (col, list, title) =>\n    [[title, '건수']].concat(list.map(v => [v, rows.filter(r => r[col] === v).length]));\n\n  // '통계' 시트를 비우고 새로 쓰기 (다시 실행해도 오류 없음)\n  const stats = ss.getSheetByName(STATS_SHEET) || ss.insertSheet(STATS_SHEET);\n  stats.clear();\n  stats.getCharts().forEach(c => stats.removeChart(c));\n\n  let row = 1;\n  const typeTableRow = row + 1;\n  row = writeTable_(stats, row, '① 상담 유형별 · 월별 건수', typeTable);\n  row = writeTable_(stats, row, '② 월별 연인원 · 실인원', personTable);\n  row = writeTable_(stats, row, '③ 상담 대상별', countBy(3, TARGETS, '상담 대상'));\n  row = writeTable_(stats, row, '④ 상담 방법별', countBy(5, METHODS, '상담 방법'));\n  writeTable_(stats, row, '⑤ 후속 조치별', countBy(7, FOLLOWUPS, '후속 조치'));\n\n  // 차트: 유형별 건수를 월별로 쌓은 막대 (합계 행 · 열은 제외)\n  const chartRange = stats.getRange(typeTableRow, 1, types.length + 1, months.length + 1);\n  const chart = stats.newChart()\n    .asColumnChart()\n    .addRange(chartRange)\n    .setStacked()\n    .setTitle('상담 유형별 건수 (월별)')\n    .setPosition(1, months.length + 4, 0, 0)\n    .build();\n  stats.insertChart(chart);\n\n  stats.autoResizeColumns(1, months.length + 2);\n  stats.activate();\n  ss.toast(`기록 ${rows.length}건으로 통계를 만들었습니다.`, '상담 도구');\n}\n\n/* ───────── 작은 도우미 함수 ───────── */\n\nfunction setList_(range, list) {\n  range.setDataValidation(SpreadsheetApp.newDataValidation().requireValueInList(list, true).build());\n}\n\nfunction writeTable_(sheet, startRow, title, table) {\n  sheet.getRange(startRow, 1).setValue(title).setFontWeight('bold').setFontSize(12);\n  const body = sheet.getRange(startRow + 1, 1, table.length, table[0].length);\n  body.setValues(table).setBorder(true, true, true, true, true, true, '#cbd5e1', SpreadsheetApp.BorderStyle.SOLID);\n  sheet.getRange(startRow + 1, 1, 1, table[0].length).setFontWeight('bold').setBackground('#ccfbf1');\n  return startRow + table.length + 3; // 표 사이에 빈 줄 2개\n}\n\nfunction unique_(list) {\n  return list.filter((v, i) => list.indexOf(v) === i);\n}\n\nfunction uniqueCodes_(rows) {\n  return unique_(rows.map(r => String(r[1]).trim()).filter(code => code !== '')).length;\n}\n\nfunction sum_(numbers) {\n  return numbers.reduce((a, b) => a + b, 0);\n}\n\n// 예시 기록 36건 (가상 데이터 · 실행할 때마다 같은 결과)\nfunction sampleRows_() {\n  let seed = 7;\n  const rnd = n => { seed = (seed * 9301 + 49297) % 233280; return Math.floor(seed / 233280 * n); };\n  const pick = list => list[rnd(list.length)];\n  const targets = ['학생', '학생', '학생', '학생', '학부모', '교사'];\n  const rows = [];\n  for (let i = 0; i \u003c 36; i++) {\n    const month = i \u003c 16 ? 8 : 9; // 0부터 세므로 8 = 9월, 9 = 10월\n    const code = 'S-' + String(1 + rnd(14)).padStart(3, '0');\n    rows.push([new Date(2026, month, 1 + rnd(28)), code, 3 + rnd(4), pick(targets), pick(TYPES), pick(METHODS), 1 + rnd(4), pick(FOLLOWUPS)]);\n  }\n  return rows.sort((a, b) => a[0] - b[0]);\n}\n","request_code.gs":"/**\n * 마음 상담 신청함 웹앱 — 서버 코드 (Code.gs)\n *\n * 학생이 휴대폰 · 태블릿으로 상담을 신청하면\n *   1) '상담신청' 시트에 한 줄이 쌓이고\n *   2) 상담 선생님(이 스크립트 주인)에게 \"새 신청이 있다\"는 알림 메일만 갑니다.\n *      (이름 · 고민 내용은 메일에 넣지 않습니다. 내용은 시트에서만 확인)\n *\n * 사용 방법\n *   1) 새 스프레드시트 → 확장 프로그램 → Apps Script → 이 코드를 Code.gs에 붙여넣기\n *   2) ＋ → HTML → 이름 'index' → 화면 코드 붙여넣기 → 저장\n *   3) 아래 설정값(상담실 이름 · 알림 메일)을 우리 학교에 맞게 바꾸기\n *   4) 배포 → 새 배포 → 웹 앱 (실행: 나 / 액세스: 모든 사용자 또는 같은 도메인 사용자)\n *   5) 시트 공유 범위는 반드시 '제한됨'(나만)으로 두기\n */\n\n// ── 설정값 ──\nconst ROOM_NAME = '마음 상담실';     // 화면 맨 위에 나오는 상담실 이름\nconst NOTIFY_EMAIL = '';            // 알림 받을 메일. 비워 두면 스크립트 주인(나)에게 보냄\nconst SHEET_NAME = '상담신청';\nconst HEADERS = ['접수 일시', '학년', '반', '이름', '상담 주제', '희망 시간', '빨리 만나고 싶어요', '하고 싶은 말', '처리 상태', '상담 예정일', '상담교사 메모'];\nconst TOPICS = ['친구 관계', '공부 · 진로', '가족', '내 마음 · 감정', '학교생활', '만나서 말할게요'];\nconst TIMES = ['아침 시간', '점심시간', '방과 후', '언제든 괜찮아요'];\nconst STATUS = ['접수', '상담 예정', '상담 완료', '외부 연계'];\nconst MAX_MESSAGE = 300;\n\n// 웹앱 주소로 접속하면 index.html을 보여 줌 (설정값을 화면에 끼워 넣음)\nfunction doGet() {\n  const page = HtmlService.createTemplateFromFile('index');\n  page.config = JSON.stringify({ roomName: ROOM_NAME, topics: TOPICS, times: TIMES, maxMessage: MAX_MESSAGE });\n  return page.evaluate()\n    .setTitle(ROOM_NAME + ' 상담 신청')\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1');\n}\n\n// 화면에서 [신청하기]를 누르면 호출됨\nfunction submitRequest(form) {\n  const data = validate_(form || {});\n\n  const lock = LockService.getScriptLock();\n  lock.waitLock(10000); // 여러 학생이 동시에 신청해도 줄이 섞이지 않게\n  try {\n    const sheet = getSheet_();\n    sheet.appendRow([\n      Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm:ss'),\n      data.grade, data.classNo, safe_(data.name), data.topic, data.time,\n      data.urgent ? '예' : '', safe_(data.message), '접수', '', ''\n    ]);\n    if (data.urgent) {\n      // 급한 신청은 행 전체를 연한 빨강으로 표시\n      sheet.getRange(sheet.getLastRow(), 1, 1, HEADERS.length).setBackground('#fde2e2');\n    }\n  } finally {\n    lock.releaseLock();\n  }\n\n  notify_(data.urgent);\n  return data.urgent\n    ? '신청이 접수되었어요. 선생님이 최대한 빨리 연락할게요.'\n    : '신청이 접수되었어요. 선생님이 확인하고 만날 시간을 알려 줄게요.';\n}\n\n// 입력값 확인 — 화면에서 막았더라도 서버에서 한 번 더 확인\nfunction validate_(form) {\n  const grade = Number(form.grade);\n  const classNo = Number(form.classNo);\n  const name = String(form.name || '').trim();\n  const message = String(form.message || '').trim();\n  if (!(grade >= 1 && grade \u003c= 6)) throw new Error('학년을 골라 주세요.');\n  if (!(classNo >= 1 && classNo \u003c= 15)) throw new Error('반을 골라 주세요.');\n  if (!name || name.length > 20) throw new Error('이름을 20자 이내로 적어 주세요.');\n  if (TOPICS.indexOf(form.topic) \u003c 0) throw new Error('상담 주제를 골라 주세요.');\n  if (TIMES.indexOf(form.time) \u003c 0) throw new Error('만나고 싶은 시간을 골라 주세요.');\n  if (message.length > MAX_MESSAGE) throw new Error('하고 싶은 말은 ' + MAX_MESSAGE + '자 이내로 적어 주세요.');\n  return { grade: grade, classNo: classNo, name: name, topic: form.topic, time: form.time, urgent: form.urgent === true, message: message };\n}\n\n// '상담신청' 시트가 없으면 머리글 · 처리 상태 드롭다운과 함께 만듦\nfunction getSheet_() {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  let sheet = ss.getSheetByName(SHEET_NAME);\n  if (!sheet) {\n    sheet = ss.insertSheet(SHEET_NAME, 0);\n    sheet.getRange(1, 1, 1, HEADERS.length).setValues([HEADERS])\n      .setFontWeight('bold').setBackground('#4c1d95').setFontColor('#ffffff');\n    sheet.setFrozenRows(1);\n    const statusRule = SpreadsheetApp.newDataValidation().requireValueInList(STATUS, true).build();\n    sheet.getRange(2, 9, 1000).setDataValidation(statusRule);\n    sheet.getRange(2, 10, 1000).setNumberFormat('yyyy-mm-dd');\n  }\n  return sheet;\n}\n\n// 알림 메일 — 누가 · 무슨 내용인지는 넣지 않고 \"새 신청이 있다\"는 사실만 알림\nfunction notify_(urgent) {\n  const to = NOTIFY_EMAIL || Session.getEffectiveUser().getEmail();\n  if (!to) return;\n  const url = SpreadsheetApp.getActiveSpreadsheet().getUrl();\n  const subject = (urgent ? '[빨리 만나고 싶어요] ' : '') + ROOM_NAME + ' 새 상담 신청이 있습니다';\n  const html =\n    '\u003cdiv style=\"font-family:Malgun Gothic,sans-serif;max-width:480px;border:1px solid #ddd6fe;border-radius:12px;overflow:hidden\">' +\n    '\u003cdiv style=\"background:' + (urgent ? '#b91c1c' : '#4c1d95') + ';color:#fff;padding:14px 18px;font-weight:bold\">' + subject + '\u003c/div>' +\n    '\u003cdiv style=\"padding:16px 18px;line-height:1.7\">새 상담 신청이 접수되었습니다.\u003cbr>' +\n    '학생 정보와 내용은 메일에 담지 않았습니다. 아래 시트에서 확인해 주세요.\u003cbr>\u003cbr>' +\n    '\u003ca href=\"' + url + '\" style=\"background:#4c1d95;color:#fff;padding:9px 14px;border-radius:8px;text-decoration:none\">상담 신청 시트 열기\u003c/a>\u003c/div>\u003c/div>';\n  MailApp.sendEmail({ to: to, subject: subject, htmlBody: html, name: ROOM_NAME });\n}\n\n// '='로 시작하는 글자가 수식으로 바뀌지 않도록 앞에 ' 를 붙임\nfunction safe_(text) {\n  return /^[=+\\-@]/.test(text) ? \"'\" + text : text;\n}\n","request_index.html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n  \u003cbase target=\"_top\">\n  \u003cmeta charset=\"UTF-8\">\n  \u003ctitle>상담 신청\u003c/title>\n  \u003cstyle>\n    * { box-sizing: border-box; margin: 0; padding: 0; }\n    body {\n      font-family: 'Malgun Gothic', sans-serif; color: #2e2a3d; line-height: 1.6;\n      background: linear-gradient(180deg, #ede9fe 0%, #fdf4ff 60%, #fff 100%); min-height: 100vh; padding: 24px 16px 40px;\n    }\n    .wrap { max-width: 480px; margin: 0 auto; }\n    .head { text-align: center; margin-bottom: 18px; }\n    .head .icon { font-size: 44px; }\n    .head h1 { font-size: 23px; color: #4c1d95; margin-top: 4px; }\n    .head p { font-size: 14px; color: #6b5f86; margin-top: 4px; }\n    .card { background: #fff; border-radius: 22px; padding: 22px 20px; box-shadow: 0 10px 28px rgba(76, 29, 149, .12); }\n    .field { margin-bottom: 20px; }\n    .label { display: block; font-weight: bold; font-size: 15px; margin-bottom: 8px; }\n    .label small { font-weight: normal; color: #8a7fa3; }\n    .row { display: flex; gap: 8px; }\n    select, input[type=text], textarea {\n      width: 100%; border: 2px solid #e4dcf7; border-radius: 12px; padding: 11px 12px;\n      font-size: 16px; font-family: inherit; color: inherit; background: #fff; outline: none;\n    }\n    select:focus, input:focus, textarea:focus { border-color: #8b5cf6; }\n    textarea { height: 100px; resize: vertical; }\n    .chips { display: flex; flex-wrap: wrap; gap: 8px; }\n    .chips button {\n      border: 2px solid #e4dcf7; background: #faf7ff; color: #4c1d95; border-radius: 999px;\n      padding: 9px 14px; font-size: 15px; font-family: inherit; cursor: pointer;\n    }\n    .chips button.on { background: #7c3aed; border-color: #7c3aed; color: #fff; font-weight: bold; }\n    .urgent { display: flex; gap: 10px; align-items: flex-start; background: #fff1f2; border: 2px solid #fecdd3;\n      border-radius: 14px; padding: 12px 14px; cursor: pointer; }\n    .urgent input { width: 22px; height: 22px; margin-top: 2px; accent-color: #e11d48; flex: none; }\n    .urgent b { color: #be123c; }\n    .help { display: none; margin-top: 10px; background: #fff7ed; border-radius: 12px; padding: 12px 14px; font-size: 14px; }\n    .help.show { display: block; }\n    .count { text-align: right; font-size: 12px; color: #8a7fa3; margin-top: 4px; }\n    .notice { font-size: 13px; color: #6b5f86; background: #f5f3ff; border-radius: 12px; padding: 11px 13px; margin-bottom: 16px; }\n    #submitBtn {\n      width: 100%; padding: 15px; border: none; border-radius: 14px; background: #7c3aed; color: #fff;\n      font-size: 17px; font-weight: bold; font-family: inherit; cursor: pointer;\n    }\n    #submitBtn:disabled { background: #c4b5fd; cursor: default; }\n    #msg { text-align: center; font-size: 14px; font-weight: bold; margin-top: 12px; min-height: 20px; color: #c0392b; }\n    .done { display: none; text-align: center; padding: 26px 10px; }\n    .done .icon { font-size: 56px; }\n    .done h2 { color: #4c1d95; margin: 8px 0; }\n    .done button { margin-top: 18px; border: 2px solid #7c3aed; background: #fff; color: #7c3aed; border-radius: 12px;\n      padding: 10px 18px; font-size: 15px; font-family: inherit; cursor: pointer; }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"icon\">🌱\u003c/div>\n      \u003ch1 id=\"roomName\">마음 상담실\u003c/h1>\n      \u003cp>이야기를 나누고 싶을 때 언제든 신청하세요.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" id=\"formCard\">\n      \u003cdiv class=\"notice\">🔒 적은 내용은 \u003cb>상담 선생님만\u003c/b> 봐요. 다만 나나 다른 사람이 위험할 수 있을 때는 안전을 위해 다른 선생님 · 보호자와 함께 도울 수 있어요.\u003c/div>\n\n      \u003cdiv class=\"field\">\n        \u003cspan class=\"label\">학년 · 반 · 이름\u003c/span>\n        \u003cdiv class=\"row\">\n          \u003cselect id=\"grade\" aria-label=\"학년\">\u003coption value=\"\">학년\u003c/option>\u003c/select>\n          \u003cselect id=\"classNo\" aria-label=\"반\">\u003coption value=\"\">반\u003c/option>\u003c/select>\n        \u003c/div>\n        \u003cinput type=\"text\" id=\"name\" maxlength=\"20\" placeholder=\"이름\" style=\"margin-top:8px\">\n      \u003c/div>\n\n      \u003cdiv class=\"field\">\n        \u003cspan class=\"label\">무엇에 대해 이야기하고 싶나요?\u003c/span>\n        \u003cdiv class=\"chips\" id=\"topics\">\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"field\">\n        \u003cspan class=\"label\">언제 만나면 좋을까요?\u003c/span>\n        \u003cdiv class=\"chips\" id=\"times\">\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"field\">\n        \u003clabel class=\"urgent\">\n          \u003cinput type=\"checkbox\" id=\"urgent\">\n          \u003cspan>\u003cb>빨리 만나고 싶어요\u003c/b>\u003cbr>\u003csmall>지금 많이 힘들거나 오늘 꼭 이야기하고 싶다면 체크하세요.\u003c/small>\u003c/span>\n        \u003c/label>\n        \u003cdiv class=\"help\" id=\"help\">\n          지금 바로 도움이 필요하면 신청을 기다리지 말고 \u003cb>담임 선생님이나 상담실\u003c/b>로 바로 와 주세요.\u003cbr>\n          ☎ 청소년 상담 \u003cb>1388\u003c/b> · 자살예방 상담 \u003cb>109\u003c/b> (24시간)\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"field\">\n        \u003cspan class=\"label\">하고 싶은 말 \u003csmall>(쓰지 않아도 괜찮아요)\u003c/small>\u003c/span>\n        \u003ctextarea id=\"message\" placeholder=\"만나서 말해도 괜찮아요.\">\u003c/textarea>\n        \u003cdiv class=\"count\">\u003cspan id=\"count\">0\u003c/span> / \u003cspan id=\"max\">300\u003c/span>\u003c/div>\n      \u003c/div>\n\n      \u003cbutton id=\"submitBtn\">신청하기\u003c/button>\n      \u003cp id=\"msg\">\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"card done\" id=\"doneCard\">\n      \u003cdiv class=\"icon\">💌\u003c/div>\n      \u003ch2>신청이 접수되었어요\u003c/h2>\n      \u003cp id=\"doneText\">\u003c/p>\n      \u003cbutton id=\"againBtn\">처음 화면으로\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cscript>\n    // 서버(Code.gs)에서 넘겨준 설정값: 상담실 이름, 주제, 시간\n    const CONFIG = \u003c?!= config ?>;\n    const state = { topic: '', time: '' };\n    const $ = id => document.getElementById(id);\n\n    $('roomName').textContent = CONFIG.roomName;\n    $('max').textContent = CONFIG.maxMessage;\n    $('message').maxLength = CONFIG.maxMessage;\n    for (let g = 1; g \u003c= 6; g++) $('grade').add(new Option(g + '학년', g));\n    for (let c = 1; c \u003c= 15; c++) $('classNo').add(new Option(c + '반', c));\n\n    // 하나만 고르는 버튼 묶음 만들기\n    function makeChips(boxId, list, key) {\n      const box = $(boxId);\n      list.forEach(text => {\n        const b = document.createElement('button');\n        b.type = 'button';\n        b.textContent = text;\n        b.addEventListener('click', () => {\n          state[key] = text;\n          box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));\n        });\n        box.appendChild(b);\n      });\n    }\n    makeChips('topics', CONFIG.topics, 'topic');\n    makeChips('times', CONFIG.times, 'time');\n\n    $('urgent').addEventListener('change', e => $('help').classList.toggle('show', e.target.checked));\n    $('message').addEventListener('input', e => { $('count').textContent = e.target.value.length; });\n\n    $('submitBtn').addEventListener('click', () => {\n      const form = {\n        grade: $('grade').value, classNo: $('classNo').value, name: $('name').value.trim(),\n        topic: state.topic, time: state.time, urgent: $('urgent').checked, message: $('message').value.trim()\n      };\n      const msg = $('msg');\n      if (!form.grade || !form.classNo || !form.name) { msg.textContent = '학년 · 반 · 이름을 적어 주세요.'; return; }\n      if (!form.topic) { msg.textContent = '이야기하고 싶은 주제를 골라 주세요.'; return; }\n      if (!form.time) { msg.textContent = '만나고 싶은 시간을 골라 주세요.'; return; }\n\n      msg.textContent = '';\n      setBusy(true); // 보내는 동안 버튼을 여러 번 누르지 못하게\n      google.script.run\n        .withSuccessHandler(text => {\n          setBusy(false);\n          $('doneText').textContent = text;\n          $('formCard').style.display = 'none';\n          $('doneCard').style.display = 'block';\n        })\n        .withFailureHandler(err => {\n          setBusy(false);\n          msg.textContent = err.message || '신청하지 못했어요. 잠시 후 다시 해 주세요.';\n        })\n        .submitRequest(form);\n    });\n\n    function setBusy(busy) {\n      $('submitBtn').disabled = busy;\n      $('submitBtn').textContent = busy ? '보내는 중…' : '신청하기';\n    }\n\n    // 다음 학생이 쓸 수 있게 입력 내용을 모두 지우고 처음 화면으로\n    $('againBtn').addEventListener('click', () => {\n      ['grade', 'classNo', 'name', 'message'].forEach(id => { $(id).value = ''; });\n      $('urgent').checked = false;\n      $('help').classList.remove('show');\n      $('count').textContent = '0';\n      state.topic = ''; state.time = '';\n      document.querySelectorAll('.chips button').forEach(b => b.classList.remove('on'));\n      $('doneCard').style.display = 'none';\n      $('formCard').style.display = 'block';\n    });\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n","counsel_parent.gs":"/**\n * 학부모 상담 주간: 예약 확인 메일 · 내 캘린더 등록 · 전날 알림\n * - 시트를 열면 [👪 학부모 상담] 메뉴가 생깁니다.\n *   ① 예약 시트 만들기   : 머리글 · 드롭다운 · 예시 2줄(받는 사람 = 내 메일)\n *   ② 확인 메일 보내기   : 'G 메일 발송'이 빈 행에만 보내고 '발송완료' 표시\n *   ③ 내 캘린더에 등록   : 'H 캘린더'가 빈 행만 등록 (일정 제목에 학생 이름은 넣지 않음)\n *   ④ 전날 알림 켜기     : 매일 아침 8시, 다음 날 상담이 있는 보호자에게 알림 메일\n */\n\nconst SHEET_NAME = '학부모상담';\nconst SENDER_NAME = '위(Wee)클래스 상담실';\nconst PLACE = '본관 2층 위(Wee)클래스';            // 대면 상담 장소\nconst CONTACT = '상담실 053-000-0000 (변경 문의)';  // 메일 아래에 넣을 연락처\nconst MINUTES = 30;                                // 상담 1회 시간(분)\nconst HEADERS = ['학년반', '학생 이름', '보호자 성함', '이메일', '상담 일시', '방법', '메일 발송', '캘린더', '전날 알림'];\nconst METHODS = ['대면', '전화', '온라인'];\nconst COL = { cls: 0, student: 1, parent: 2, email: 3, when: 4, method: 5, mailed: 6, calendar: 7, reminded: 8 };\n\nfunction onOpen() {\n  SpreadsheetApp.getUi()\n    .createMenu('👪 학부모 상담')\n    .addItem('① 예약 시트 만들기 (예시 포함)', 'setupSheet')\n    .addItem('② 확인 메일 보내기', 'sendConfirmations')\n    .addItem('③ 내 캘린더에 등록', 'addToCalendar')\n    .addSeparator()\n    .addItem('④ 전날 알림 켜기 (매일 오전 8시)', 'turnOnReminder')\n    .addItem('⑤ 전날 알림 끄기', 'turnOffReminder')\n    .addToUi();\n}\n\n// ① 예약 시트 준비\nfunction setupSheet() {\n  const ss = SpreadsheetApp.getActive();\n  let sheet = ss.getSheetByName(SHEET_NAME);\n  const hasRows = sheet && sheet.getLastRow() > 1;\n  if (!sheet) sheet = ss.insertSheet(SHEET_NAME, 0);\n\n  sheet.getRange(1, 1, 1, HEADERS.length).setValues([HEADERS])\n    .setFontWeight('bold').setBackground('#1d4ed8').setFontColor('#ffffff');\n  sheet.setFrozenRows(1);\n  sheet.getRange(2, COL.when + 1, 300).setNumberFormat('yyyy-mm-dd hh:mm');\n  sheet.getRange(2, COL.method + 1, 300)\n    .setDataValidation(SpreadsheetApp.newDataValidation().requireValueInList(METHODS, true).build());\n\n  if (!hasRows) {\n    // 예시: 받는 사람을 '내 메일'로 두어 실습 중 다른 사람에게 메일이 가지 않게 함\n    const me = Session.getEffectiveUser().getEmail();\n    const tomorrow = new Date();\n    tomorrow.setDate(tomorrow.getDate() + 1);\n    const at = (h, m) => new Date(tomorrow.getFullYear(), tomorrow.getMonth(), tomorrow.getDate(), h, m);\n    sheet.getRange(2, 1, 2, HEADERS.length).setValues([\n      ['3학년 2반', '김하늘', '김보호', me, at(15, 0), '대면', '', '', ''],\n      ['5학년 1반', '이바다', '이보호', me, at(16, 0), '전화', '', '', '']\n    ]);\n  }\n  sheet.autoResizeColumns(1, HEADERS.length);\n  ss.toast('예약 시트를 준비했습니다. 예시 메일은 내 메일로 갑니다.', '학부모 상담');\n}\n\n// ② 확인 메일: 아직 보내지 않은 행에만\nfunction sendConfirmations() {\n  const sent = forEachRow_(COL.mailed, row => {\n    sendMail_(row, '[상담 예약 확인] ' + row[COL.cls] + ' ' + row[COL.student] + ' 학생 보호자 상담 안내', '상담 예약이 확정되었습니다.');\n    return '발송완료';\n  });\n  SpreadsheetApp.getActive().toast(sent + '건의 확인 메일을 보냈습니다.', '학부모 상담');\n}\n\n// ③ 캘린더 등록: 아직 등록하지 않은 행만 (제목에는 학년반과 방법만)\nfunction addToCalendar() {\n  const calendar = CalendarApp.getDefaultCalendar();\n  const added = forEachRow_(COL.calendar, row => {\n    const start = row[COL.when];\n    const end = new Date(start.getTime() + MINUTES * 60 * 1000);\n    calendar.createEvent('학부모 상담 (' + row[COL.cls] + ', ' + row[COL.method] + ')', start, end, {\n      location: row[COL.method] === '대면' ? PLACE : '',\n      description: '자세한 내용은 학부모상담 시트에서 확인'\n    });\n    return '등록완료';\n  });\n  SpreadsheetApp.getActive().toast(added + '건을 내 캘린더에 등록했습니다.', '학부모 상담');\n}\n\n// ④ 전날 알림 — 시간 기반 트리거가 매일 아침 실행\nfunction remindTomorrow() {\n  const tz = Session.getScriptTimeZone();\n  const tomorrow = new Date();\n  tomorrow.setDate(tomorrow.getDate() + 1);\n  const target = Utilities.formatDate(tomorrow, tz, 'yyyy-MM-dd');\n  forEachRow_(COL.reminded, row => {\n    if (Utilities.formatDate(row[COL.when], tz, 'yyyy-MM-dd') !== target) return null; // 내일이 아니면 건너뜀\n    sendMail_(row, '[내일 상담 안내] ' + row[COL.cls] + ' ' + row[COL.student] + ' 학생 보호자 상담', '내일 상담 일정을 다시 안내해 드립니다.');\n    return '알림완료';\n  });\n}\n\nfunction turnOnReminder() {\n  turnOffReminder(); // 같은 트리거가 두 번 생기지 않게 먼저 지움\n  ScriptApp.newTrigger('remindTomorrow').timeBased().everyDays(1).atHour(8).create();\n  SpreadsheetApp.getActive().toast('매일 오전 8시쯤 다음 날 상담 알림을 보냅니다.', '학부모 상담');\n}\n\nfunction turnOffReminder() {\n  ScriptApp.getProjectTriggers()\n    .filter(t => t.getHandlerFunction() === 'remindTomorrow')\n    .forEach(t => ScriptApp.deleteTrigger(t));\n}\n\n/* ───────── 도우미 함수 ───────── */\n\n// 표시 열(markCol)이 비어 있고 필수 값이 맞는 행마다 work(row)를 실행하고, 돌려준 글자를 표시 열에 씀\nfunction forEachRow_(markCol, work) {\n  const sheet = SpreadsheetApp.getActive().getSheetByName(SHEET_NAME);\n  if (!sheet || sheet.getLastRow() \u003c 2) return 0;\n  const range = sheet.getRange(2, 1, sheet.getLastRow() - 1, HEADERS.length);\n  const rows = range.getValues();\n  let done = 0;\n  rows.forEach((row, i) => {\n    if (row[markCol] !== '' || !isValid_(row)) return;\n    const mark = work(row);\n    if (mark) {\n      sheet.getRange(i + 2, markCol + 1).setValue(mark);\n      done++;\n    }\n  });\n  return done;\n}\n\nfunction isValid_(row) {\n  return row[COL.student] !== '' && /^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(String(row[COL.email]).trim()) && row[COL.when] instanceof Date;\n}\n\n// 카드 모양 HTML 메일\nfunction sendMail_(row, subject, lead) {\n  const tz = Session.getScriptTimeZone();\n  const d = row[COL.when];\n  const dayName = '일월화수목금토'.charAt(Number(Utilities.formatDate(d, tz, 'u')) % 7); // u: 월=1 … 일=7\n  const when = Utilities.formatDate(d, tz, 'M월 d일') + '(' + dayName + ') ' + Utilities.formatDate(d, tz, 'HH:mm');\n  const how = row[COL.method] === '대면' ? '대면 · ' + PLACE\n    : row[COL.method] === '전화' ? '전화 (상담 선생님이 그 시간에 전화드립니다)' : '온라인 (접속 주소는 따로 안내)';\n  const line = (k, v) => '\u003ctr>\u003ctd style=\"padding:6px 0;color:#64748b;width:84px\">' + k + '\u003c/td>\u003ctd style=\"padding:6px 0\">\u003cb>' + esc_(v) + '\u003c/b>\u003c/td>\u003c/tr>';\n  const html =\n    '\u003cdiv style=\"font-family:Malgun Gothic,sans-serif;max-width:520px;border:1px solid #dbeafe;border-radius:14px;overflow:hidden\">' +\n    '\u003cdiv style=\"background:#1d4ed8;color:#fff;padding:16px 20px;font-size:17px;font-weight:bold\">' + esc_(SENDER_NAME) + '\u003c/div>' +\n    '\u003cdiv style=\"padding:18px 20px;line-height:1.7\">' + esc_(row[COL.parent]) + ' 보호자님, 안녕하세요.\u003cbr>' + esc_(lead) +\n    '\u003ctable style=\"margin:12px 0;border-top:1px solid #e2e8f0;width:100%\">' +\n    line('학생', row[COL.cls] + ' ' + row[COL.student]) + line('일시', when) + line('방법', how) + '\u003c/table>' +\n    '\u003cp style=\"color:#64748b;font-size:13px\">일정 변경이 필요하시면 ' + esc_(CONTACT) + '으로 알려 주세요.\u003c/p>\u003c/div>\u003c/div>';\n  MailApp.sendEmail({ to: String(row[COL.email]).trim(), subject: subject, htmlBody: html, name: SENDER_NAME });\n}\n\n// 메일 HTML 안에 넣는 글자에서 \u003c > & 같은 기호를 안전하게 바꿈\nfunction esc_(text) {\n  return String(text).replace(/[&\u003c>\"]/g, c => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n}\n","counsel_program.gs":"/**\n * 집단상담 프로그램 운영 키트 (독립형)\n * 실행 한 번으로 아래 3가지를 만듭니다.\n *   1) 참가 신청 설문지 (응답은 운영 시트의 새 탭에 자동 저장)\n *   2) 운영 시트: '회기 계획' 탭 + '출석부' 탭(회기별 체크박스 · 출석 횟수 · 이수 여부 자동 계산)\n *   3) 내 캘린더에 회기별 일정 (같은 날 같은 제목이 있으면 건너뜀)\n *\n * 사용 방법: script.new → 이 코드 붙여넣기 → 아래 PROGRAM 값을 우리 프로그램에 맞게 고치기\n *           → 함수 buildProgramKit 실행(▶) → 권한 승인 → 실행 로그의 주소 확인\n */\n\nconst PROGRAM = {\n  name: '마음 근육 키우기 집단상담',\n  target: '5~6학년',\n  capacity: 10,\n  place: '위(Wee)클래스 집단상담실',\n  passRate: 0.8,           // 이수 기준: 전체 회기의 80% 이상 출석\n  deadline: '2026년 11월 6일(금)',\n  sessions: [              // 날짜, 시작, 끝, 주제, 준비물\n    ['2026-11-11', '14:30', '15:10', '1회기 · 마음 열기: 나를 소개해요', '이름표, 감정 카드'],\n    ['2026-11-18', '14:30', '15:10', '2회기 · 감정 알아차리기', '감정 온도계 활동지'],\n    ['2026-11-25', '14:30', '15:10', '3회기 · 화가 날 때 나는', '호흡 카드, 색연필'],\n    ['2026-12-02', '14:30', '15:10', '4회기 · 친구에게 마음 전하기', '역할극 대본'],\n    ['2026-12-09', '14:30', '15:10', '5회기 · 나의 강점 찾기', '강점 카드 세트'],\n    ['2026-12-16', '14:30', '15:10', '6회기 · 마무리와 다짐', '수료증, 롤링페이퍼']\n  ]\n};\n\nfunction buildProgramKit() {\n  const ss = createSheet_();\n  const form = createForm_(ss);\n  const added = addCalendarEvents_();\n\n  Logger.log('✅ 운영 시트(교사용): ' + ss.getUrl());\n  Logger.log('✅ 신청서 편집(교사용): ' + form.getEditUrl());\n  Logger.log('✅ 신청서 배포(학생 · 보호자용): ' + form.getPublishedUrl());\n  Logger.log('✅ 캘린더 일정 ' + added + '개 등록');\n}\n\n// 운영 시트: 회기 계획 + 출석부\nfunction createSheet_() {\n  const ss = SpreadsheetApp.create(PROGRAM.name + ' 운영 시트');\n  const n = PROGRAM.sessions.length;\n\n  // 회기 계획 탭\n  const plan = ss.getSheets()[0].setName('회기 계획');\n  const planRows = [['회기', '날짜', '시간', '주제', '준비물', '활동 메모']]\n    .concat(PROGRAM.sessions.map((s, i) => [i + 1, s[0], s[1] + '~' + s[2], s[3], s[4], '']));\n  plan.getRange(1, 1, planRows.length, 6).setValues(planRows);\n  styleHeader_(plan, 6, '#0f766e');\n  plan.setColumnWidth(4, 260);\n  plan.setColumnWidth(6, 260);\n\n  // 출석부 탭: 이름 | 학년반 | 1회기 … n회기(체크박스) | 출석 횟수 | 이수 여부\n  const att = ss.insertSheet('출석부');\n  const head = ['이름', '학년반'].concat(PROGRAM.sessions.map((s, i) => (i + 1) + '회기\\n' + s[0].slice(5)), ['출석 횟수', '이수 여부']);\n  att.getRange(1, 1, 1, head.length).setValues([head]);\n  styleHeader_(att, head.length, '#7c3aed');\n  const rows = PROGRAM.capacity;\n  att.getRange(2, 3, rows, n).insertCheckboxes();\n\n  // 출석 횟수와 이수 여부는 수식으로 자동 계산 (이름이 비면 빈칸)\n  const firstCol = columnLetter_(3);\n  const lastCol = columnLetter_(2 + n);\n  const formulas = [];\n  for (let r = 2; r \u003c= rows + 1; r++) {\n    const count = 'COUNTIF(' + firstCol + r + ':' + lastCol + r + ',TRUE)';\n    formulas.push([\n      '=IF(A' + r + '=\"\",\"\",' + count + ')',\n      '=IF(A' + r + '=\"\",\"\",IF(' + count + '>=' + Math.ceil(n * PROGRAM.passRate) + ',\"이수\",\"미이수\"))'\n    ]);\n  }\n  att.getRange(2, 3 + n, rows, 2).setFormulas(formulas);\n  att.setFrozenColumns(2);\n\n  // 이수 여부에 따라 색 표시\n  const resultRange = att.getRange(2, 4 + n, rows, 1);\n  att.setConditionalFormatRules([\n    SpreadsheetApp.newConditionalFormatRule().whenTextEqualTo('이수').setBackground('#dcfce7').setRanges([resultRange]).build(),\n    SpreadsheetApp.newConditionalFormatRule().whenTextEqualTo('미이수').setBackground('#fee2e2').setRanges([resultRange]).build()\n  ]);\n  return ss;\n}\n\n// 참가 신청 설문지 (응답은 운영 시트에 연결)\nfunction createForm_(ss) {\n  const first = PROGRAM.sessions[0];\n  const last = PROGRAM.sessions[PROGRAM.sessions.length - 1];\n  const form = FormApp.create(PROGRAM.name + ' 참가 신청서')\n    .setDescription(\n      '대상: ' + PROGRAM.target + ' (선착순 ' + PROGRAM.capacity + '명)\\n' +\n      '일정: ' + first[0] + ' ~ ' + last[0] + ', 매주 ' + first[1] + '~' + first[2] + ' (총 ' + PROGRAM.sessions.length + '회기)\\n' +\n      '장소: ' + PROGRAM.place + '\\n신청 마감: ' + PROGRAM.deadline)\n    .setConfirmationMessage('신청해 주셔서 고맙습니다. 참가 확정은 담임 선생님을 통해 안내합니다.');\n\n  form.addSectionHeaderItem().setTitle('1. 학생 정보');\n  form.addTextItem().setTitle('학생 이름').setRequired(true);\n  form.addTextItem().setTitle('학년 · 반').setHelpText('예: 5학년 2반').setRequired(true);\n  form.addSectionHeaderItem().setTitle('2. 참가 동기');\n  form.addCheckboxItem().setTitle('이 프로그램에서 해 보고 싶은 것 (여러 개 고를 수 있어요)')\n    .setChoiceValues(['내 감정을 잘 알고 싶어요', '친구와 잘 지내고 싶어요', '화를 잘 다스리고 싶어요', '나의 좋은 점을 찾고 싶어요', '그냥 재미있어 보여요']);\n  form.addSectionHeaderItem().setTitle('3. 동의');\n  form.addCheckboxItem().setTitle('보호자 동의')\n    .setChoiceValues(['보호자가 프로그램 참가에 동의합니다.']).setRequired(true);\n  form.addCheckboxItem().setTitle('개인정보 수집 · 이용 동의')\n    .setHelpText('수집 항목: 이름, 학년 · 반 / 목적: 프로그램 운영 / 보유 기간: 프로그램 종료 후 1년')\n    .setChoiceValues(['동의합니다.']).setRequired(true);\n\n  form.setDestination(FormApp.DestinationType.SPREADSHEET, ss.getId());\n  return form;\n}\n\n// 캘린더 일정 등록 (중복 방지)\nfunction addCalendarEvents_() {\n  const calendar = CalendarApp.getDefaultCalendar();\n  let added = 0;\n  PROGRAM.sessions.forEach(s => {\n    const start = toDate_(s[0], s[1]);\n    const end = toDate_(s[0], s[2]);\n    const title = PROGRAM.name + ' ' + s[3].split(' · ')[0];\n    const exists = calendar.getEventsForDay(start).some(e => e.getTitle() === title);\n    if (exists) return;\n    calendar.createEvent(title, start, end, { location: PROGRAM.place, description: s[3] + '\\n준비물: ' + s[4] });\n    added++;\n  });\n  return added;\n}\n\n/* ───────── 도우미 함수 ───────── */\n\n// '2026-11-11', '14:30' → 한국 시간 Date (연 · 월 · 일 · 시 · 분을 나눠서 만들어 하루 밀림 방지)\nfunction toDate_(ymd, hm) {\n  const d = ymd.split('-').map(Number);\n  const t = hm.split(':').map(Number);\n  return new Date(d[0], d[1] - 1, d[2], t[0], t[1]);\n}\n\nfunction styleHeader_(sheet, width, color) {\n  sheet.getRange(1, 1, 1, width).setFontWeight('bold').setBackground(color).setFontColor('#ffffff')\n    .setVerticalAlignment('middle').setWrap(true);\n  sheet.setFrozenRows(1);\n}\n\n// 열 번호 → 열 글자 (3 → C, 27 → AA)\nfunction columnLetter_(n) {\n  let s = '';\n  while (n > 0) {\n    const m = (n - 1) % 26;\n    s = String.fromCharCode(65 + m) + s;\n    n = Math.floor((n - 1) / 26);\n  }\n  return s;\n}\n","counsel_gemini.gs":"/**\n * Gemini 마음 카드 · 활동 아이디어 (시트 수식으로 쓰기)\n *   =MINDCARD(\"시험이 걱정될 때\", \"5학년\")      → 학생에게 건넬 응원 · 마음 다스리기 문장 3줄\n *   =GROUPIDEA(\"친구 사이 갈등\", \"4학년\", 40)   → 집단상담 활동 아이디어 (도입 · 활동 · 마무리)\n *\n * 사용 방법\n *   1) AI Studio(aistudio.google.com/apikey)에서 API 키 발급\n *   2) Apps Script 왼쪽 ⚙ 프로젝트 설정 → 스크립트 속성 → 속성 추가\n *      속성: GEMINI_API_KEY / 값: 발급받은 키   (키를 코드에 직접 쓰지 않음)\n *   3) 시트 셀에 위 수식을 입력\n *\n * ⚠ 상황 칸에는 '일반적인 상황'만 적습니다. 학생 이름 · 상담 내용 같은 개인정보는 절대 넣지 마세요.\n */\n\nconst MODEL = 'gemini-flash-latest'; // 404 오류가 나면 AI Studio에서 지금 쓸 수 있는 모델 이름으로 바꾸기\nconst CACHE_HOURS = 6;               // 같은 질문은 6시간 동안 다시 묻지 않음 (사용량 절약)\n\n/**\n * 학생에게 건넬 응원 · 마음 다스리기 문장 3줄을 만듭니다.\n * @param {string} situation 일반적인 상황 (예: 시험이 걱정될 때)\n * @param {string} grade 학년 (예: 5학년)\n * @return 문장 3줄\n * @customfunction\n */\nfunction MINDCARD(situation, grade) {\n  if (!situation) return '상황을 적어 주세요.';\n  const prompt =\n    '너는 초등학교 전문상담교사야. ' + (grade || '초등학생') + '에게 건넬 마음 카드 문장을 써 줘.\\n' +\n    '상황: ' + situation + '\\n' +\n    '- 3줄: ① 마음을 알아주는 말 ② 지금 해 볼 수 있는 작은 방법 1가지 ③ 응원하는 말\\n' +\n    '- 각 줄은 40자 이내, 아이 눈높이의 쉬운 말, 존댓말 아닌 다정한 반말\\n' +\n    '- 진단하거나 훈계하지 말고, 번호 없이 줄바꿈으로만 구분';\n  return askGemini_(prompt);\n}\n\n/**\n * 집단상담 · 학급 단위 활동 아이디어를 만듭니다.\n * @param {string} topic 주제 (예: 친구 사이 갈등)\n * @param {string} grade 학년\n * @param {number} minutes 활동 시간(분)\n * @return 도입 · 활동 · 마무리 계획\n * @customfunction\n */\nfunction GROUPIDEA(topic, grade, minutes) {\n  if (!topic) return '주제를 적어 주세요.';\n  const prompt =\n    '너는 초등학교 전문상담교사야. ' + (grade || '초등학생') + ' 대상 집단상담 활동을 ' + (minutes || 40) + '분 분량으로 계획해 줘.\\n' +\n    '주제: ' + topic + '\\n' +\n    '- 도입 / 활동 / 마무리 세 부분, 부분마다 2문장 이내\\n' +\n    '- 준비물은 교실에 흔한 것만, 마지막 줄에 \"유의점:\" 한 줄\\n' +\n    '- 학생이 자기 이야기를 억지로 꺼내지 않아도 참여할 수 있게';\n  return askGemini_(prompt);\n}\n\n// Gemini API 호출 (같은 질문은 캐시에서 꺼내 사용)\nfunction askGemini_(prompt) {\n  const key = PropertiesService.getScriptProperties().getProperty('GEMINI_API_KEY');\n  if (!key) return '⚠ 스크립트 속성에 GEMINI_API_KEY를 넣어 주세요.';\n\n  const cache = CacheService.getScriptCache();\n  const cacheKey = Utilities.base64EncodeWebSafe(Utilities.computeDigest(Utilities.DigestAlgorithm.MD5, prompt, Utilities.Charset.UTF_8));\n  const saved = cache.get(cacheKey);\n  if (saved) return saved;\n\n  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + MODEL + ':generateContent';\n  const response = UrlFetchApp.fetch(url, {\n    method: 'post',\n    contentType: 'application/json',\n    headers: { 'x-goog-api-key': key },\n    payload: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),\n    muteHttpExceptions: true\n  });\n\n  const code = response.getResponseCode();\n  if (code !== 200) return '⚠ Gemini 오류 ' + code + ': 키 · 모델 이름을 확인해 주세요.';\n  const data = JSON.parse(response.getContentText());\n  const parts = (((data.candidates || [])[0] || {}).content || {}).parts || [];\n  const text = parts.map(p => p.text || '').join('').trim();\n  if (!text) return '⚠ 답을 받지 못했습니다. 상황을 조금 바꿔 다시 시도해 주세요.';\n\n  cache.put(cacheKey, text, CACHE_HOURS * 3600);\n  return text;\n}\n"};
</script>

<script>
(function () {

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const ext = url => `href="${esc(url)}" target="_blank" rel="noopener noreferrer"`;

  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  async function copyText(text, label) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toast((label || '내용') + '을(를) 복사했습니다');
  }

  const store = {
    get(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 저장 불가 환경 */ } }
  };
  let doneSet = new Set(store.get('gas-lab-done', []));
  const saveDone = () => store.set('gas-lab-done', [...doneSet]);

  const levelBadge = lv => ({ '쉬움': 'b-green', '보통': 'b-blue', '도전': 'b-red' }[lv] || '');

  /* ── HOME ── */
  function renderHome() {
    const c = D.course;
    const session = s => `
      <div class="card session">
        <div class="session-top"><span class="badge b-blue">${esc(s.no)}</span><span class="muted" style="font-size:14px">${esc(s.time)}</span></div>

    $('#view-home').innerHTML = `

        <div class="meta">
          <span class="badge">💻 크롬 브라우저 + 구글 계정</span>

        </div>
        <div class="table-wrap" style="margin-top:14px">
          <table>
            <tr><th style="width:22%">구분</th><th>독립형</th><th>컨테이너형</th></tr>
            <tr><td>저장 위치</td><td>드라이브에 별도 파일(Apps Script 아이콘)</td><td>시트 · 문서 · 폼 파일 안 (드라이브에 따로 보이지 않음)</td></tr>
            <tr><td>데이터 접근</td><td><code>SpreadsheetApp.openById()</code> 등으로 파일을 지정</td><td><code>getActiveSpreadsheet()</code>로 연결된 파일을 바로 사용</td></tr>

            <tr><th style="width:20%">종류</th><th style="width:30%">예</th><th>특징</th></tr>
            <tr><td><span class="badge b-blue">단순 트리거</span></td><td><code>onOpen()</code>, <code>onEdit(e)</code></td><td>함수 이름만 맞추면 자동 실행. 메일 발송처럼 권한이 필요한 작업은 할 수 없습니다. (STEP 1 메뉴 만들기)</td></tr>

              <tr><th colspan="2">다음 사용자 인증 정보로 실행 (실행 계정)</th></tr>
              <tr><td style="width:36%"><b>나</b></td><td>내 권한으로 내 시트에 기록. 학생 · 참가자가 로그인 없이 제출하는 웹앱은 대부분 이것을 고릅니다.</td></tr>

  function renderRoom(roomKey, labId) {
    const room = ROOMS[roomKey];
    const labs = room.labs;
    const lab = labs.find(l => l.id === labId) || labs[0];
    const idx = labs.indexOf(lab);
    const doneCount = labs.filter(l => doneSet.has(l.id)).length;

    const sideItem = l => `<a class="side-item ${l.id === lab.id ? 'active' : ''} ${doneSet.has(l.id) ? 'done' : ''}" href="#${roomKey}/${l.id}"><span class="chk"></span><span>${esc(l.title)}</span></a>`;
    let sideList = '';
    if (room.groups) {
      sideList = room.groups.map(g => {
        const items = labs.filter(l => l.group === g.id);
        return `<div class="side-group"><b>${esc(g.label)}</b><span>${esc(g.title)}</span></div>${items.map(sideItem).join('')}`;
      }).join('');
    } else {
      sideList = labs.map(sideItem).join('');
    }
    const options = labs.map(l => {
      const g = room.groups ? room.groups.find(x => x.id === l.group) : null;
      return `<option value="${esc(l.id)}" ${l.id === lab.id ? 'selected' : ''}>${g ? esc(g.label) + ' · ' : ''}${esc(l.title)}${doneSet.has(l.id) ? ' ✓' : ''}</option>`;
    }).join('');

    const group = room.groups ? room.groups.find(g => g.id === lab.group) : null;
    const linkIcon = { copy: '📄', done: '✅', app: '▶', gist: '{ }', form: '📝', sheet: '➕', ai: '✨' };
    const links = (lab.links || []).map(k => `<a class="btn k-${esc(k.kind)}" ${ext(k.url)}><span class="ico">${linkIcon[k.kind] || '↗'}</span>${esc(k.label)}</a>`).join('');

    let n = 0;
    const block = (title, inner) => `<div class="lab-block"><h3><span class="num">${++n}</span>${title}</h3>${inner}</div>`;

    let html = '';
    if (lab.concepts) html += block('핵심 개념', `<ul class="clean concepts">${lab.concepts.map(c => `<li>${fmt(c)}</li>`).join('')}</ul>`);
    if (lab.steps) html += block('따라 하기', `<ol class="follow">${lab.steps.map(s => `<li>${fmt(s)}</li>`).join('')}</ol>`);
    if (lab.ideas) html += block('이런 앱은 어때요?', `<div class="chips">${lab.ideas.map(i => `<span class="chip" style="cursor:default">${esc(i)}</span>`).join('')}</div>`);
    if (lab.prompt) html += block('바이브 코딩 프롬프트', `
      <div class="prompt-box">
        <div class="box-bar"><span class="t">Gemini에 붙여 넣어 코드를 받아 보세요</span>
          <a class="btn sm" ${ext('https://gemini.google.com/')}>Gemini 열기 ↗</a>
          <button class="btn sm" data-copy-prompt>프롬프트 복사</button></div>
        <pre>${esc(lab.prompt)}</pre>
      </div>`);
    if (lab.files && lab.files.length) html += block('완성 코드', `
      ${lab.codeNote ? `<div class="callout info code-note"><span class="ci">ℹ️</span><span>${fmt(lab.codeNote)}</span></div>` : ''}
      <div class="code-box">
        <div class="code-tabs">
          ${lab.files.map((f, i) => `<button class="tab ${i === 0 ? 'active' : ''}" data-file="${i}">${esc(f.name)}</button>`).join('')}
          <span class="spacer"></span><span class="lines" id="code-lines"></span>
          <button class="btn sm dark" data-copy-code>코드 복사</button>
        </div>
        <pre><code id="code-view"></code></pre>
      </div>`);
    if (lab.result) html += block('실행 결과', `<div class="callout ok"><span class="ci">🎯</span><span>${fmt(lab.result)}</span></div>`);
    if (lab.tips && lab.tips.length) html += block('알아 두기', `<ul class="clean">${lab.tips.map(t => `<li>${fmt(t)}</li>`).join('')}</ul>`);

    const prev = labs[idx - 1], next = labs[idx + 1];
    const isDone = doneSet.has(lab.id);

    $('#view-' + roomKey).innerHTML = `
      <div class="lab-layout">
        <aside class="card lab-side">
          <div class="room"><b>${esc(room.title)}</b><small>${esc(room.desc)}</small>
            <a class="btn primary room-go" ${ext(room.shortcut.url)}><span class="ico">＋</span>${esc(room.shortcut.label)} ↗</a></div>
          <div class="progress" title="완료 ${doneCount}/${labs.length}"><i style="width:${Math.round(doneCount / labs.length * 100)}%"></i></div>
          <select class="side-select" aria-label="실습 선택">${options}</select>
          <div class="side-list">${sideList}</div>
        </aside>
        <article class="card lab">
          <div class="lab-head">
            <div class="row">
              <div>
                <div class="badges">
                  ${group ? `<span class="badge b-yellow">${esc(group.label)} · ${esc(group.title)}</span>` : ''}
                  <span class="badge">${esc(lab.service)}</span>
                  <span class="badge ${levelBadge(lab.level)}">${esc(lab.level)}</span>
                  <span class="badge">⏱ ${esc(lab.time)}</span>
                </div>
                <h2>${esc(lab.title)}</h2>
                <p>${fmt(lab.summary)}</p>
              </div>
              <button class="btn done-toggle ${isDone ? 'on' : ''}" data-done>${isDone ? '✓ 완료함' : '완료 표시'}</button>
            </div>
            ${links ? `<div class="link-row">${links}</div>` : ''}
          </div>
          ${html}
          <div class="pager">
            ${prev ? `<a class="btn" href="#${roomKey}/${prev.id}"><span><small>이전</small>← ${esc(prev.title)}</span></a>` : '<span></span>'}
            ${next ? `<a class="btn" href="#${roomKey}/${next.id}" style="text-align:right"><span><small>다음</small>${esc(next.title)} →</span></a>` : ({ standalone: `<a class="btn primary" href="#container">컨테이너형 실습으로 →</a>`, container: `<a class="btn primary" href="#counsel">상담 실습실로 →</a>`, counsel: `<a class="btn primary" href="#appsheet">STEP 4 AppSheet로 →</a>` })[roomKey]}
          </div>
        </article>
      </div>`;

    const view = $('#view-' + roomKey);
    $('.side-select', view).addEventListener('change', e => { location.hash = roomKey + '/' + e.target.value; });
    $('[data-done]', view).addEventListener('click', () => {
      if (doneSet.has(lab.id)) doneSet.delete(lab.id); else doneSet.add(lab.id);
      saveDone();
      renderRoom(roomKey, lab.id);
    });
    const pb = $('[data-copy-prompt]', view);
    if (pb) pb.addEventListener('click', () => copyText(lab.prompt, '프롬프트'));

    if (lab.files && lab.files.length) {
      let current = 0;
      const show = i => {
        current = i;
        const f = lab.files[i];
        const src = CODES[f.src] || '// 코드를 불러오지 못했습니다: ' + f.src;
        const el = $('#code-view', view);
        el.className = f.name.endsWith('.html') ? 'language-xml' : 'language-javascript';
        el.textContent = src;
        if (window.hljs) { el.removeAttribute('data-highlighted'); window.hljs.highlightElement(el); }
        $('#code-lines', view).textContent = src.split('\n').length + '줄';
        view.querySelectorAll('.code-tabs .tab').forEach((b, j) => b.classList.toggle('active', j === i));
      };
      view.querySelectorAll('.code-tabs .tab').forEach(b => b.addEventListener('click', () => show(Number(b.dataset.file))));
      $('[data-copy-code]', view).addEventListener('click', () => copyText(CODES[lab.files[current].src] || '', lab.files[current].name));
      show(0);
    }
  }

          <form id="share-form" novalidate>
            <div class="form-field"><label for="sf-name">이름 (소속)</label><input id="sf-name" maxlength="40" placeholder="예: 홍길동 (○○초)" required></div>
            <div class="form-field"><label for="sf-title">앱 이름</label><input id="sf-title" maxlength="60" placeholder="예: 우리 반 감정일기" required></div>
            <div class="form-field"><label for="sf-tool">만든 도구</label><select id="sf-tool">${TOOLS.map(t => `<option>${esc(t)}</option>`).join('')}</select></div>
            <div class="form-field"><label for="sf-url">링크</label><input id="sf-url" type="url" maxlength="500" placeholder="https://script.google.com/macros/s/…/exec" required></div>
            <div class="form-field"><label for="sf-desc">한 줄 소개 (선택)</label><textarea id="sf-desc" maxlength="300" placeholder="어떤 업무 · 수업에 쓰는 앱인가요?"></textarea></div>
            <button class="btn primary" type="submit" id="sf-submit" style="width:100%;justify-content:center" ${ready ? '' : 'disabled'}>공유하기</button>
            <div class="form-msg" id="sf-msg"></div>
          </form>
          <div class="callout warn" style="margin-top:6px;font-size:14px"><span class="ci">✔</span><span>올리기 전 확인: 웹앱 액세스가 <b>모든 사용자</b>인지, 주소가 <code>/exec</code>로 끝나는지, 학생 개인정보가 보이지 않는지</span></div>
        </div>
        <div>
          ${ready ? `
            <div class="share-tools">
              <div class="chips" id="share-chips">${['전체'].concat(TOOLS).map(t => `<button class="chip ${t === shareFilter ? 'active' : ''}" data-tool="${esc(t)}">${esc(t)}</button>`).join('')}</div>
              <input class="search" id="share-search" placeholder="앱 이름 · 이름 검색" value="${esc(shareQuery)}">
              <button class="btn sm" id="share-refresh">새로고침</button>
            </div>
            <div class="grid g2" id="share-list"><div class="card empty" style="grid-column:1/-1">불러오는 중…</div></div>` : `
            <div class="card pad">
              <div class="callout info"><span class="ci">🛠</span><span>공유 게시판을 준비하고 있습니다. 잠시 후 다시 확인해 주세요.</span></div>
            </div>`}
        </div>
      </div>`;

    $('#share-form').addEventListener('submit', submitShare);

    if (ready) {
      $('#share-chips').addEventListener('click', e => {
        const b = e.target.closest('[data-tool]');
        if (!b) return;
        shareFilter = b.dataset.tool;
        document.querySelectorAll('#share-chips .chip').forEach(c => c.classList.toggle('active', c === b));
        drawShares();
      });
      $('#share-search').addEventListener('input', e => { shareQuery = e.target.value; drawShares(); });
      $('#share-refresh').addEventListener('click', loadShares);
      loadShares();
    }
  }

  async function loadShares() {
    try {
      const res = await fetch(SHARE_API_URL);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '목록 오류');
      shareItems = data.items || [];
      drawShares();
    } catch (err) {
      const list = $('#share-list');
      if (list) list.innerHTML = `<div class="card empty" style="grid-column:1/-1">목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.<br><small>${esc(err.message)}</small></div>`;
    }
  }

  function timeAgo(iso) {
    const t = new Date(iso).getTime();
    if (!t) return '';
    const m = Math.floor((Date.now() - t) / 60000);
    if (m < 1) return '방금';
    if (m < 60) return m + '분 전';
    if (m < 1440) return Math.floor(m / 60) + '시간 전';
    return new Date(t).toLocaleDateString('ko-KR');
  }

  function drawShares() {
    const list = $('#share-list');
    if (!list) return;
    const q = shareQuery.trim().toLowerCase();
    const items = shareItems.filter(it =>
      (shareFilter === '전체' || it.tool === shareFilter) &&
      (!q || (it.title + ' ' + it.name + ' ' + it.description).toLowerCase().includes(q)));
    if (!items.length) {
      list.innerHTML = `<div class="card empty" style="grid-column:1/-1">${shareItems.length ? '조건에 맞는 작품이 없습니다.' : '아직 올라온 작품이 없습니다. 첫 번째로 공유해 보세요!'}</div>`;
      return;
    }
    list.innerHTML = '';
    items.forEach(it => {
      const card = document.createElement('div');
      card.className = 'card share-card';
      const safeUrl = /^https:\/\//i.test(it.url) ? it.url : '';
      card.innerHTML = `
        <div class="who"><span class="badge b-blue"></span><span class="n"></span><span class="t"></span></div>
        <h4></h4><p></p>
        ${safeUrl ? `<a class="btn sm" target="_blank" rel="noopener noreferrer">열어 보기 ↗</a>` : ''}`;
      card.querySelector('.badge').textContent = it.tool;
      card.querySelector('.n').textContent = it.name;
      card.querySelector('.t').textContent = timeAgo(it.createdAt);
      card.querySelector('h4').textContent = it.title;
      card.querySelector('p').textContent = it.description || '';
      if (safeUrl) card.querySelector('a').href = safeUrl;
      list.appendChild(card);
    });
  }

  async function submitShare(e) {
    e.preventDefault();
    const msg = $('#sf-msg');
    const btn = $('#sf-submit');
    const payload = {
      name: $('#sf-name').value.trim(),
      title: $('#sf-title').value.trim(),
      tool: $('#sf-tool').value,
      url: $('#sf-url').value.trim(),
      description: $('#sf-desc').value.trim()
    };
    msg.className = 'form-msg err';
    if (!SHARE_API_URL) { msg.textContent = '게시판이 아직 연결되지 않았습니다.'; return; }
    if (!payload.name || !payload.title || !payload.url) { msg.textContent = '이름, 앱 이름, 링크를 입력해 주세요.'; return; }
    if (!/^https:\/\/\S+$/i.test(payload.url)) { msg.textContent = '링크는 https:// 로 시작해야 합니다.'; return; }

    btn.disabled = true;
    btn.textContent = '올리는 중…';
    try {
      // text/plain으로 보내면 Apps Script 웹앱과 CORS 사전 요청 없이 통신할 수 있음
      const res = await fetch(SHARE_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '등록 실패');
      msg.className = 'form-msg ok';
      msg.textContent = '공유되었습니다. 고맙습니다!';
      ['sf-title', 'sf-url', 'sf-desc'].forEach(id => { $('#' + id).value = ''; });
      store.set('gas-share-name', payload.name);
      loadShares();
    } catch (err) {
      msg.textContent = '등록하지 못했습니다: ' + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = '공유하기';
    }
  }

  /* ── ROUTER ── */
  const rendered = {};
  function route() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, '')) || 'home';
    const [view, sub] = raw.split('/');
    const known = ['home', 'standalone', 'container', 'counsel', 'appsheet', 'examples', 'share'];
    const v = known.includes(view) ? view : 'home';

    document.querySelectorAll('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + v));
    document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('active', a.dataset.view === v));

    if (ROOMS[v]) {
      // 실습실들은 같은 id(code-view 등)를 쓰므로 다른 실습실 화면은 비움
      Object.keys(ROOMS).filter(k => k !== v).forEach(k => { $('#view-' + k).innerHTML = ''; });
      renderRoom(v, sub);
      window.scrollTo(0, 0);
    } else {
      if (!rendered[v]) {
        ({ home: renderHome, appsheet: renderAppSheet, examples: renderExamples, share: renderShare })[v]();
        rendered[v] = v !== 'share'; // 공유 탭은 들어올 때마다 새로 불러옴
      }
      if (v === 'share' && !rendered.shareName) {
        const nm = store.get('gas-share-name', '');
        if (nm && $('#sf-name')) $('#sf-name').value = nm;
      }
      if (v === 'home' && sub) {
        const target = document.getElementById(sub);
        if (target) setTimeout(() => target.scrollIntoView({ behavior: 'smooth' }), 30);
      } else {
        window.scrollTo(0, 0);
      }
    }

    clearInterval(shareTimer);
    if (v === 'share' && SHARE_API_URL) shareTimer = setInterval(loadShares, 30000);
  }

  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
